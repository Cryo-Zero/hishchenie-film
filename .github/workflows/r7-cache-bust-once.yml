name: R7 owner feedback cache bust once

on:
  push:
    branches:
      - revival-r7-responsive-mobile

permissions:
  contents: write

jobs:
  cache-bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revival-r7-responsive-mobile
      - name: Refresh R7 asset cache keys and cleanup
        shell: bash
        run: |
          sed -i 's/?v=revival-r7/?v=r7-owner-20260910b/g' index.html reviews.html
          rm -f .github/workflows/r7-cache-bust-once.yml
          git config user.name "Cryo-Zero"
          git config user.email "Bogdan.Vedrentsov@gmail.com"
          git add index.html reviews.html .github/workflows/r7-cache-bust-once.yml
          git commit -m "chore: refresh R7 preview asset cache keys [skip ci]"
          git push origin HEAD:revival-r7-responsive-mobile
