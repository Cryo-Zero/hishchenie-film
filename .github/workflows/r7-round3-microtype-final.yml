name: R7 Round3 microtype final verification

on:
  push:
    branches:
      - revival-r7-responsive-mobile

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact Round3 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "74fba68097261c1476a5f62cf7c75e9cefd2407a"
          git worktree add /tmp/r7-before e5a5c26ff9be2ff7d845cbf8f14de77ef5ed83db

      - name: Align mobile signal-data microtype to owner +2px direction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('css/responsive-r7-polish.css')
          s=p.read_text(encoding='utf-8')
          old='''  .current-signal::after,\n  .signal-log-row time,\n  .signal-log-row b { font-size: 9px !important; }\n\n  .signal-data dt,\n  .hero-system-strip,'''
          new='''  .current-signal::after,\n  .signal-log-row time,\n  .signal-log-row b,\n  .signal-data dt { font-size: 9px !important; }\n\n  .hero-system-strip,'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected one Round3 mobile microtype group, found {s.count(old)}')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY

      - name: Install Chromium QA runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r7qa /tmp/r7-round3-evidence/screenshots
          cd /tmp/r7qa
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          git -C "$GITHUB_WORKSPACE" show bdb8f087272d23c269074726f78c43b549dd14ab:qa/r7-round3-final.cjs > /tmp/r7qa/round3.cjs

      - name: Re-run full real Chromium matrix
        shell: bash
        env:
          NODE_PATH: /tmp/r7qa/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 4172 --directory /tmp/r7-before >/tmp/r7-before-http.log 2>&1 &
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" >/tmp/r7-after-http.log 2>&1 &
          sleep 1
          node /tmp/r7qa/round3.cjs
          python3 - <<'PY'
          import json
          p='/tmp/r7-round3-evidence/TYPOGRAPHY.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['mobile390']['before']['signalDataDt']=='7px', d['mobile390']['before']['signalDataDt']
          assert d['mobile390']['after']['signalDataDt']=='9px', d['mobile390']['after']['signalDataDt']
          assert d['desktop1366']['after']['signalDataDt']=='11px', d['desktop1366']['after']['signalDataDt']
          print('signalDataDt final: desktop',d['desktop1366']['before']['signalDataDt'],'->',d['desktop1366']['after']['signalDataDt'],'mobile',d['mobile390']['before']['signalDataDt'],'->',d['mobile390']['after']['signalDataDt'])
          PY

      - name: Refresh Round3 evidence doc and commit final tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('docs/releases/revival/R7/OWNER-FEEDBACK-ROUND3.md')
          s=p.read_text(encoding='utf-8')
          typography=json.load(open('/tmp/r7-round3-evidence/TYPOGRAPHY.json',encoding='utf-8'))
          report=Path('/tmp/r7-round3-evidence/REPORT.md').read_text(encoding='utf-8')
          a='## Computed typography evidence\n\n```json\n'
          b='\n```\n\n## Browser QA evidence\n\n'
          c='\n\nScreenshots and machine-readable results were produced by the temporary GitHub Actions/Playwright harness'
          if a not in s or b not in s or c not in s:
              raise SystemExit('Round3 evidence markers not found')
          prefix,rest=s.split(a,1)
          _,rest2=rest.split(b,1)
          _,suffix=rest2.split(c,1)
          new=prefix+a+json.dumps(typography,ensure_ascii=False,indent=2)+b+report+c+suffix
          p.write_text(new,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add css/responsive-r7-polish.css docs/releases/revival/R7/OWNER-FEEDBACK-ROUND3.md
          git rm .github/workflows/r7-round3-microtype-final.yml
          git diff --cached --check
          git commit -m "REVIVAL R7: align Round3 mobile microtype"
          git push origin HEAD:revival-r7-responsive-mobile
          git rev-parse HEAD | tee /tmp/r7-round3-evidence/FINAL_SHA.txt

      - name: Upload final Round3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-round3-owner-final-evidence
          path: /tmp/r7-round3-evidence
          if-no-files-found: warn
