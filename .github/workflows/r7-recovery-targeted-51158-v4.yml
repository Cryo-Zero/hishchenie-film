name: R7 recovery targeted 51158 v4
on:
  push:
    branches: [revival-r7-responsive-mobile]
    paths: [.github/workflows/r7-recovery-targeted-51158-v4.yml]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Guard exact product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=51158b052186d880a9b5eaab2d1c6f66e7497322
          git merge-base --is-ancestor "$PRODUCT" HEAD
          test -z "$(git diff --name-only "$PRODUCT"..HEAD -- index.html reviews.html admin assets css js supabase migrations | sed -n '1p')"
          git worktree add /tmp/product "$PRODUCT"
          printf '%s\n' "$PRODUCT" >/tmp/product.txt
          printf '%s\n' "$(git rev-parse HEAD)" >/tmp/trigger.txt
          node --check /tmp/product/js/r7-owner-corrections.js
          ! grep -q 'scheduleRestore' /tmp/product/js/r7-owner-corrections.js
      - name: Install browsers and prepare harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qa && cd /tmp/qa
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          source=Path('.github/workflows/r7-owner-corrections-apply-targeted.yml').read_text(encoding='utf-8')
          m=re.search(r"echo '([^']+)' \| base64 -d \| gzip -d >/tmp/r7-owner-targeted\.cjs",source)
          if not m: raise SystemExit('targeted payload missing')
          s=gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          replacements={
            "await p.locator('#cast .cast-list-item').first().click();await p.locator('.r7-subject-back').waitFor({state:'visible'});const sy1=await p.evaluate(()=>scrollY);":"await p.evaluate(()=>document.querySelector('#cast .cast-list-item')?.click());await p.locator('.r7-subject-back').waitFor({state:'visible'});await p.waitForTimeout(220);const sy1=await p.evaluate(()=>scrollY);",
            "await p.locator('.r7-subject-back').click();await p.waitForFunction(()=>!document.querySelector('#cast').classList.contains('r7-dossier-open'));const sy2=await p.evaluate(()=>scrollY);":"await p.evaluate(()=>document.querySelector('.r7-subject-back')?.click());await p.waitForFunction(()=>!document.querySelector('#cast').classList.contains('r7-dossier-open'));await p.waitForTimeout(220);const sy2=await p.evaluate(()=>scrollY);",
            "await p.locator('#faq .faq-query-item').first().click();await p.locator('.r7-query-back').waitFor({state:'visible'});const fy1=await p.evaluate(()=>scrollY);":"await p.evaluate(()=>document.querySelector('#faq .faq-query-item')?.click());await p.locator('.r7-query-back').waitFor({state:'visible'});await p.waitForTimeout(220);const fy1=await p.evaluate(()=>scrollY);",
            "await p.locator('.r7-query-back').click();await p.waitForFunction(()=>!document.querySelector('#faq').classList.contains('r7-response-open'));const fy2=await p.evaluate(()=>scrollY);":"await p.evaluate(()=>document.querySelector('.r7-query-back')?.click());await p.waitForFunction(()=>!document.querySelector('#faq').classList.contains('r7-response-open'));await p.waitForTimeout(220);const fy2=await p.evaluate(()=>scrollY);"
          }
          for old,new in replacements.items():
            if s.count(old)!=1: raise SystemExit('targeted marker mismatch')
            s=s.replace(old,new,1)
          Path('/tmp/targeted.cjs').write_text(s,encoding='utf-8')
          PY
          cat > /tmp/cycles.cjs <<'NODE'
          const { chromium, firefox, webkit } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const BASE = process.env.BASE_URL || 'http://127.0.0.1:4175';
          const OUT = process.env.EVIDENCE_DIR || '/tmp/r7-owner-targeted-final';
          const PRODUCT = process.env.PRODUCT_SHA || '';
          const engines = { chromium, firefox, webkit };
          const viewports = [
            {w:390,h:844,name:'390x844'},
            {w:430,h:932,name:'430x932'},
            {w:844,h:390,name:'844x390'}
          ];
          const results=[];
          const errors=[];
          const record=(ok,browser,viewport,name,detail={})=>{
            const row={ok,browser,viewport,name,detail};
            results.push(row);
            if(!ok) console.error('FAIL',browser,viewport,name,JSON.stringify(detail));
          };
          const closeEnough=(a,b,t=2)=>Math.abs(a-b)<=t;
          async function settle(page, ms=260){ await page.waitForTimeout(ms); }
          async function geometry(page, rootSel, rowSel){
            return await page.evaluate(({rootSel,rowSel})=>{
              const root=document.querySelector(rootSel);
              const rows=[...document.querySelectorAll(rowSel)];
              const rr=root?.getBoundingClientRect();
              return {
                scrollY,
                minHeight: root ? getComputedStyle(root).minHeight : null,
                rect: rr ? {top:rr.top,left:rr.left,width:rr.width,height:rr.height} : null,
                rows: rows.map(el=>Math.round(el.getBoundingClientRect().height*100)/100)
              };
            },{rootSel,rowSel});
          }
          (async()=>{
            for(const [browserName,launcher] of Object.entries(engines)){
              const browser=await launcher.launch({headless:true});
              for(const vp of viewports){
                const context=await browser.newContext({viewport:{width:vp.w,height:vp.h},hasTouch:true});
                const page=await context.newPage();
                page.on('pageerror',e=>errors.push({browser:browserName,viewport:vp.name,type:'pageerror',message:e.message}));
                await page.goto(`${BASE}/index.html#faq`,{waitUntil:'load'});
                await page.waitForFunction(()=>document.body.classList.contains('r7-sequential-ui'));
                await page.evaluate(()=>document.querySelector('#faq .faq-query-item')?.scrollIntoView({block:'center',behavior:'auto'}));
                await settle(page,120);
                const faqBefore=await geometry(page,'#faq .faq-console','#faq .faq-query-item');
                for(let cycle=1;cycle<=4;cycle++){
                  const y0=await page.evaluate(()=>scrollY);
                  await page.evaluate(()=>document.querySelector('#faq .faq-query-item')?.click());
                  await page.waitForFunction(()=>document.querySelector('#faq')?.classList.contains('r7-response-open'));
                  await page.waitForFunction(()=>{
                    const b=document.querySelector('#faq .r7-query-back');
                    return b && getComputedStyle(b).display!=='none' && b.getClientRects().length>0;
                  });
                  await settle(page);
                  const open=await geometry(page,'#faq .faq-console','#faq .faq-query-item');
                  record(closeEnough(y0,open.scrollY),browserName,vp.name,`FAQ cycle ${cycle} open keeps scrollY`,{before:y0,after:open.scrollY});
                  record(open.minHeight==='0px',browserName,vp.name,`FAQ cycle ${cycle} has no phantom min-height`,{minHeight:open.minHeight});
                  const structural=await page.evaluate(()=>{
                    const panel=document.querySelector('#faq .faq-response-panel');
                    const nodes=[...document.querySelectorAll('#faq .faq-system-box > div, #faq .faq-response-log')];
                    return {
                      panelTransform: panel?getComputedStyle(panel).transform:null,
                      nodeTransforms:nodes.map(n=>getComputedStyle(n).transform),
                      visible:panel?panel.getClientRects().length>0:false
                    };
                  });
                  record(structural.visible && structural.panelTransform==='none' && structural.nodeTransforms.every(v=>v==='none'),browserName,vp.name,`FAQ cycle ${cycle} structural geometry stays un-translated`,structural);
                  const yOpen=open.scrollY;
                  await page.evaluate(()=>document.querySelector('#faq .r7-query-back')?.click());
                  await page.waitForFunction(()=>!document.querySelector('#faq')?.classList.contains('r7-response-open'));
                  await settle(page);
                  const closed=await geometry(page,'#faq .faq-console','#faq .faq-query-item');
                  record(closeEnough(yOpen,closed.scrollY),browserName,vp.name,`FAQ cycle ${cycle} back keeps scrollY`,{before:yOpen,after:closed.scrollY});
                  record(closed.minHeight==='0px',browserName,vp.name,`FAQ cycle ${cycle} back has no phantom min-height`,{minHeight:closed.minHeight});
                  record(JSON.stringify(closed.rows)===JSON.stringify(faqBefore.rows),browserName,vp.name,`FAQ cycle ${cycle} restores real query-row geometry`,{before:faqBefore.rows,after:closed.rows});
                }
                await page.goto(`${BASE}/index.html#cast`,{waitUntil:'load'});
                await page.waitForFunction(()=>document.body.classList.contains('r7-sequential-ui'));
                await page.evaluate(()=>document.querySelector('#cast .cast-list-item')?.scrollIntoView({block:'center',behavior:'auto'}));
                await settle(page,120);
                const castBefore=await geometry(page,'#cast .cast-console','#cast .cast-list-item');
                for(let cycle=1;cycle<=4;cycle++){
                  const y0=await page.evaluate(()=>scrollY);
                  await page.evaluate(()=>document.querySelector('#cast .cast-list-item')?.click());
                  await page.waitForFunction(()=>document.querySelector('#cast')?.classList.contains('r7-dossier-open'));
                  await page.waitForFunction(()=>{
                    const b=document.querySelector('#cast .r7-subject-back');
                    return b && getComputedStyle(b).display!=='none' && b.getClientRects().length>0;
                  });
                  await settle(page);
                  const open=await geometry(page,'#cast .cast-console','#cast .cast-list-item');
                  record(closeEnough(y0,open.scrollY),browserName,vp.name,`Actors cycle ${cycle} open keeps scrollY`,{before:y0,after:open.scrollY});
                  record(open.minHeight==='0px',browserName,vp.name,`Actors cycle ${cycle} has no phantom min-height`,{minHeight:open.minHeight});
                  const yOpen=open.scrollY;
                  await page.evaluate(()=>document.querySelector('#cast .r7-subject-back')?.click());
                  await page.waitForFunction(()=>!document.querySelector('#cast')?.classList.contains('r7-dossier-open'));
                  await settle(page);
                  const closed=await geometry(page,'#cast .cast-console','#cast .cast-list-item');
                  record(closeEnough(yOpen,closed.scrollY),browserName,vp.name,`Actors cycle ${cycle} back keeps scrollY`,{before:yOpen,after:closed.scrollY});
                  record(closed.minHeight==='0px',browserName,vp.name,`Actors cycle ${cycle} back has no phantom min-height`,{minHeight:closed.minHeight});
                  record(JSON.stringify(closed.rows)===JSON.stringify(castBefore.rows),browserName,vp.name,`Actors cycle ${cycle} restores real row geometry`,{before:castBefore.rows,after:closed.rows});
                }
                await context.close();
              }
              await browser.close();
            }
            const failed=results.filter(r=>!r.ok);
            const output={
              product_sha:PRODUCT,
              total:results.length,
              passed:results.length-failed.length,
              failed:failed.length,
              page_errors:errors.length,
              failures:failed,
              errors,
              viewports:viewports.map(v=>v.name),
              browsers:Object.keys(engines),
              cycles_per_scene:4
            };
            fs.mkdirSync(OUT,{recursive:true});
            fs.writeFileSync(path.join(OUT,'RECOVERY-CYCLES.json'),JSON.stringify(output,null,2));
            console.log(JSON.stringify(output,null,2));
            process.exit(failed.length||errors.length?1:0);
          })().catch(err=>{console.error(err);process.exit(2);});
          NODE
          NODE_PATH=/tmp/qa/node_modules node --check /tmp/targeted.cjs
          NODE_PATH=/tmp/qa/node_modules node --check /tmp/cycles.cjs
      - name: Run targeted suites
        shell: bash
        env:
          NODE_PATH: /tmp/qa/node_modules
          BASE_URL: http://127.0.0.1:4175
          PRODUCT_SHA: 51158b052186d880a9b5eaab2d1c6f66e7497322
          EVIDENCE_DIR: /tmp/evidence
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence
          cp /tmp/product.txt /tmp/evidence/PRODUCT_SHA.txt
          cp /tmp/trigger.txt /tmp/evidence/AUDIT_TRIGGER_HEAD.txt
          cp /tmp/targeted.cjs /tmp/evidence/HARNESS-SOURCE.cjs
          cp /tmp/cycles.cjs /tmp/evidence/RECOVERY-CYCLES-SOURCE.cjs
          python3 -m http.server 4175 --bind 127.0.0.1 --directory /tmp/product >/tmp/evidence/server.log 2>&1 & S=$!
          trap 'kill $S 2>/dev/null || true' EXIT
          sleep 1
          set +e
          timeout 1200s node /tmp/targeted.cjs
          A=$?
          timeout 900s node /tmp/cycles.cjs
          B=$?
          set -e
          printf 'targeted=%s\ncycles=%s\n' "$A" "$B" >/tmp/evidence/AUDIT_EXIT_CODE.txt
          test "$A" -eq 0
          test "$B" -eq 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-recovery-targeted-51158-v4-evidence
          path: /tmp/evidence
          if-no-files-found: warn
