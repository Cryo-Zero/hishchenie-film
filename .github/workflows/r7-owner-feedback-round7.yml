name: R7 owner visual corrections browser QA

on:
  push:
    branches:
      - revival-r7-responsive-mobile

permissions:
  contents: write

jobs:
  round7:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard Round6 runtime and curator documentation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          ROUND6=f5e154912986c95e7f48a15bce34c707db39667c
          ROUND5=4197adc13cc91cbad395e6d2819e0fbb23278449
          DOCBASE=1b83cd39e13f439ac1a6da084a8f9a6544f810f3

          git merge-base --is-ancestor "$ROUND6" "$DOCBASE"
          git merge-base --is-ancestor "$DOCBASE" HEAD
          git diff --name-only "$ROUND6".."$DOCBASE" | sort >/tmp/docbase-actual
          printf '%s\n' \
            '.github/workflows/r7-owner-feedback-round7.yml' \
            'docs/current/BACKLOG.md' \
            'docs/current/PROJECT-STATE.md' \
            'docs/current/ROADMAP.md' \
            'docs/current/START-HERE.md' \
            'docs/current/VISUAL-SYSTEM.md' \
            'docs/releases/revival/R7/OWNER-FEEDBACK-ROUND7-PENDING.md' \
            'scripts/r7_round7_apply.py' \
            'scripts/r7_round7_finalize.py' \
            'scripts/r7_round7_qa.cjs' | sort >/tmp/docbase-expected
          diff -u /tmp/docbase-expected /tmp/docbase-actual

          # Only the finalizer/gate itself changed after the curator checkpoint.
          git diff --name-only "$DOCBASE"..HEAD | sort >/tmp/staging-actual
          printf '%s\n' \
            '.github/workflows/r7-owner-feedback-round7.yml' \
            'scripts/r7_round7_finalize.py' | sort >/tmp/staging-expected
          diff -u /tmp/staging-expected /tmp/staging-actual

          git worktree add /tmp/r7-round7-round5 "$ROUND5"
          git worktree add /tmp/r7-round7-round6 "$ROUND6"
          cp scripts/r7_round7_apply.py /tmp/r7_round7_apply.py
          cp scripts/r7_round7_finalize.py /tmp/r7_round7_finalize.py
          cp scripts/r7_round7_qa.cjs /tmp/r7_round7_qa.cjs

      - name: Apply scoped Round7 runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/r7_round7_apply.py
          git diff --check
          git diff --name-only | sort >/tmp/runtime-actual
          printf '%s\n' \
            'css/responsive-r7-owner-round2.css' \
            'js/responsive-r7.js' | sort >/tmp/runtime-expected
          diff -u /tmp/runtime-expected /tmp/runtime-actual

      - name: Install and prepare Chromium QA runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r7qa
          cd /tmp/r7qa
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/r7_round7_qa.cjs').read_text(encoding='utf-8')

          # Run 35090298453 proved two QA-timing false negatives: 45ms was too
          # early to observe the authored opacity interpolation reliably. Keep
          # the same <.95 acceptance, sample later inside the 140ms outgoing phase.
          old = 'await p.waitForTimeout(45);'
          if src.count(old) != 2:
              raise SystemExit(f'Round7 reveal timing marker mismatch: {src.count(old)}')
          src = src.replace(old, 'await p.waitForTimeout(100);')

          # The help control starts below the fold. Playwright correctly scrolls
          # a clicked off-screen button into view; that is not product reflow.
          # Put the control in view before the baseline snapshot so the assertion
          # measures layout/scroll caused by OPENING help, not test-runner focus scroll.
          old = "  const tag = `[${v.name}][reviews]`;\n  const before = await p.evaluate(() => {"
          new = "  const tag = `[${v.name}][reviews]`;\n  await p.locator('#profileHelpToggle').scrollIntoViewIfNeeded();\n  await p.waitForTimeout(80);\n  const before = await p.evaluate(() => {"
          if src.count(old) != 1:
              raise SystemExit(f'Round7 help baseline marker mismatch: {src.count(old)}')
          src = src.replace(old, new, 1)

          wrapped = "(async () => {\n" + src + "\n})().catch(err => { console.error(err); process.exit(1); });\n"
          Path('/tmp/r7_round7_qa_run.cjs').write_text(wrapped, encoding='utf-8')
          PY
          NODE_PATH=/tmp/r7qa/node_modules node --check /tmp/r7_round7_qa_run.cjs

      - name: Pre-commit full browser and visual-regression matrix
        shell: bash
        env:
          NODE_PATH: /tmp/r7qa/node_modules
        run: |
          set -euo pipefail
          rm -rf /tmp/r7-round7-pre && mkdir -p /tmp/r7-round7-pre
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/r7-target.log 2>&1 & P1=$!
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/r7-round7-round5 >/tmp/r7-round5.log 2>&1 & P2=$!
          python3 -m http.server 4175 --bind 127.0.0.1 --directory /tmp/r7-round7-round6 >/tmp/r7-round6.log 2>&1 & P3=$!
          trap 'kill $P1 $P2 $P3 2>/dev/null || true' EXIT
          sleep 1
          timeout 480s env \
            TARGET_URL=http://127.0.0.1:4173 \
            ROUND5_URL=http://127.0.0.1:4174 \
            ROUND6_URL=http://127.0.0.1:4175 \
            EVIDENCE_DIR=/tmp/r7-round7-pre \
            node /tmp/r7_round7_qa_run.cjs

      - name: Create clean Round7 final commit
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/r7_round7_finalize.py

      - name: Exact-final-SHA full browser and screenshot verification
        shell: bash
        env:
          NODE_PATH: /tmp/r7qa/node_modules
        run: |
          set -euo pipefail
          ROUND6=f5e154912986c95e7f48a15bce34c707db39667c
          FINAL=$(cat /tmp/r7-round7-final-sha.txt)
          test "$(git rev-parse HEAD)" = "$FINAL"
          test -z "$(git status --porcelain)"
          for f in \
            .github/workflows/r7-owner-feedback-round7.yml \
            scripts/r7_round7_apply.py \
            scripts/r7_round7_finalize.py \
            scripts/r7_round7_qa.cjs; do
            test ! -e "$f"
          done

          git diff --name-only "$ROUND6"..HEAD | sort >/tmp/final-actual
          printf '%s\n' \
            'css/responsive-r7-owner-round2.css' \
            'docs/current/BACKLOG.md' \
            'docs/current/DECISIONS.md' \
            'docs/current/PROJECT-STATE.md' \
            'docs/current/ROADMAP.md' \
            'docs/current/START-HERE.md' \
            'docs/current/VISUAL-SYSTEM.md' \
            'docs/releases/revival/R7/OWNER-FEEDBACK-ROUND7-PENDING.md' \
            'docs/releases/revival/R7/OWNER-FEEDBACK-ROUND7.md' \
            'docs/releases/revival/R7/PREVIEW-HANDOFF.md' \
            'js/responsive-r7.js' | sort >/tmp/final-expected
          diff -u /tmp/final-expected /tmp/final-actual
          ! git diff --name-only "$ROUND6"..HEAD | grep -Eq '(^|/)js/public-response\.js$|(^|/)admin/|supabase|migrations'

          rm -rf /tmp/r7-round7-final && mkdir -p /tmp/r7-round7-final
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/r7-target-final.log 2>&1 & P1=$!
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/r7-round7-round5 >/tmp/r7-round5-final.log 2>&1 & P2=$!
          python3 -m http.server 4175 --bind 127.0.0.1 --directory /tmp/r7-round7-round6 >/tmp/r7-round6-final.log 2>&1 & P3=$!
          trap 'kill $P1 $P2 $P3 2>/dev/null || true' EXIT
          sleep 1
          timeout 480s env \
            TARGET_URL=http://127.0.0.1:4173 \
            ROUND5_URL=http://127.0.0.1:4174 \
            ROUND6_URL=http://127.0.0.1:4175 \
            EVIDENCE_DIR=/tmp/r7-round7-final \
            node /tmp/r7_round7_qa_run.cjs
          printf '%s\n' "$FINAL" >/tmp/r7-round7-final/FINAL_SHA.txt
          printf '%s\n' \
            'ROUND5=4197adc13cc91cbad395e6d2819e0fbb23278449' \
            'ROUND6=f5e154912986c95e7f48a15bce34c707db39667c' \
            'CURATOR_DOCBASE=1b83cd39e13f439ac1a6da084a8f9a6544f810f3' \
            "ROUND7=$FINAL" >/tmp/r7-round7-final/BASELINES.txt
          test -z "$(git status --porcelain)"

      - name: Push exact verified final SHA
        shell: bash
        run: |
          set -euo pipefail
          FINAL=$(cat /tmp/r7-round7-final-sha.txt)
          test "$(git rev-parse HEAD)" = "$FINAL"
          test -z "$(git status --porcelain)"
          git push origin HEAD:revival-r7-responsive-mobile
          REMOTE=$(git ls-remote origin refs/heads/revival-r7-responsive-mobile | cut -f1)
          test "$REMOTE" = "$FINAL"
          echo "FINAL_SHA=$FINAL"
          echo "REMOTE_SHA=$REMOTE"

      - name: Upload exact-final Round7 browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: r7-round7-exact-final-browser-evidence
          path: /tmp/r7-round7-final
