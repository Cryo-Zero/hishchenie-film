name: R7 owner corrections full recovery audit
on:
  push:
    branches: [revival-r7-responsive-mobile]
    paths: [.github/workflows/r7-owner-corrections-full-recovery.yml]
permissions:
  contents: read
jobs:
  full-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Guard exact product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=66c31fa36896b3b968799ec154fd3bbdb6f4a2e5
          git merge-base --is-ancestor "$PRODUCT" HEAD
          test -z "$(git diff --name-only "$PRODUCT"..HEAD -- index.html reviews.html admin assets css js supabase migrations | sed -n '1p')"
          git worktree add /tmp/product "$PRODUCT"
          printf '%s\n' "$PRODUCT" >/tmp/product.txt
          printf '%s\n' "$(git rev-parse HEAD)" >/tmp/trigger.txt
          node --check /tmp/product/js/r7-owner-corrections.js
      - name: Install browsers and restore verified harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qa && cd /tmp/qa
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit >/dev/null 2>&1
          echo '' | base64 -d | gzip -d >/tmp/full.cjs
          sha256sum /tmp/full.cjs
          test "$(sha256sum /tmp/full.cjs | awk '{print $1}')" = "93e90d1ddd6d14e4289015d6552c4ab4f2516b2a6d7ea2686057bb813ea63c52"
          NODE_PATH=/tmp/qa/node_modules node --check /tmp/full.cjs
      - name: Run full audit
        shell: bash
        env:
          NODE_PATH: /tmp/qa/node_modules
          BASE_URL: http://127.0.0.1:4173
          PRODUCT_SHA: 66c31fa36896b3b968799ec154fd3bbdb6f4a2e5
          EVIDENCE_DIR: /tmp/full-evidence
        run: |
          set -euo pipefail
          OUT=/tmp/full-evidence
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp /tmp/product.txt "$OUT/PRODUCT_SHA.txt"
          cp /tmp/trigger.txt "$OUT/AUDIT_TRIGGER_HEAD.txt"
          cp /tmp/full.cjs "$OUT/HARNESS-SOURCE.cjs"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/product >"$OUT/server.log" 2>&1 & S=$!
          trap 'kill $S 2>/dev/null || true' EXIT
          sleep 1
          set +e
          timeout 1800s node /tmp/full.cjs
          X=$?
          set -e
          echo "$X" >"$OUT/AUDIT_EXIT_CODE.txt"
          BAD=$(grep -c 'GET /css/assets/images/archive/' "$OUT/server.log" || true)
          GOOD=$(grep -c 'GET /assets/images/archive/archive-01.jpg .* 200 ' "$OUT/server.log" || true)
          printf 'bad_archive_path_requests=%s\ncorrect_archive_01_http_200=%s\n' "$BAD" "$GOOD" >"$OUT/ARCHIVE-REGRESSION.txt"
          test "$BAD" -eq 0
          test "$GOOD" -gt 0
          test "$X" -eq 0
      - name: Upload full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-owner-corrections-full-recovery-evidence
          path: /tmp/full-evidence
          if-no-files-found: warn
