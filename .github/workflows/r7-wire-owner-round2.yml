name: R7 wire owner round2 once

on:
  push:
    branches: [revival-r7-responsive-mobile]
    paths:
      - '.github/workflows/r7-wire-owner-round2.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire owner round2 assets and cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('index.html', 'reviews.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('?v=r7-owner-20260910b', '?v=r7-owner-20260911a')
              marker = '<link rel="stylesheet" href="css/responsive-r7-polish.css?v=r7-owner-20260911a">'
              extra = '<link rel="stylesheet" href="css/responsive-r7-owner-round2.css?v=r7-owner-20260911a">'
              if extra not in s:
                  if marker not in s:
                      raise SystemExit(f'missing R7 polish marker in {name}')
                  s = s.replace(marker, marker + '\n' + extra, 1)
              p.write_text(s, encoding='utf-8')
          Path('.github/workflows/r7-wire-owner-round2.yml').unlink()
          PY
          git config user.name "Cryo-Zero"
          git config user.email "Bogdan.Vedrentsov@gmail.com"
          git add index.html reviews.html .github/workflows/r7-wire-owner-round2.yml
          git commit -m "chore: activate owner feedback round2 [skip ci]"
          git push
