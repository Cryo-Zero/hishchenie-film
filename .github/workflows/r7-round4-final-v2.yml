name: R7 Round4 final browser QA v2

on:
  push:
    branches:
      - revival-r7-responsive-mobile

permissions:
  contents: write

jobs:
  round4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify continuation staging state
        shell: bash
        run: |
          set -euo pipefail
          BASE=a97faa551aba14df059bec815445fd1200dc8360
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE"..HEAD | sort >/tmp/r7-current.txt
          cat >/tmp/r7-expected.txt <<'EOF'
          .github/workflows/r7-round4-final-v2.yml
          qa/r7-round4-patch.py
          qa/r7-round4-qa.cjs
          EOF
          diff -u /tmp/r7-expected.txt /tmp/r7-current.txt
          git worktree add /tmp/r7-before "$BASE"
          cp qa/r7-round4-qa.cjs /tmp/r7-round4-qa.cjs

      - name: Apply Round4 implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/r7-round4-patch.py
          git diff --check
          git diff --quiet a97faa551aba14df059bec815445fd1200dc8360 -- js/public-response.js
          git diff --quiet a97faa551aba14df059bec815445fd1200dc8360 -- js/site.js

      - name: Apply real-browser corrections actor fix and privacy addendum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css=Path('css/responsive-r7-polish.css')
          s=css.read_text(encoding='utf-8')
          if '/* ROUND4 REAL-BROWSER CORRECTIONS */' in s:
              raise SystemExit('Round4 correction marker already present')
          s += r'''

          /* ROUND4 REAL-BROWSER CORRECTIONS */
          @property --r7-contact-shift {
            syntax: '<length>';
            inherits: false;
            initial-value: 0px;
          }
          .contact-signal-track i {
            --r7-contact-shift: 0px;
            transform: translateX(var(--r7-contact-shift)) !important;
            animation: r7ContactLocalSignalFixed 3.2s ease-in-out infinite alternate !important;
          }
          @keyframes r7ContactLocalSignalFixed {
            0% { --r7-contact-shift: 0px; opacity: .54; box-shadow: 0 0 7px rgba(155,196,199,.38); }
            100% { --r7-contact-shift: -8px; opacity: .96; box-shadow: 0 0 13px rgba(155,196,199,.68); }
          }
          body.community-page #profileHelpPanel.profile-help-panel .info-overlay-card {
            background: rgba(7,13,14,.84) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
          }
          body.community-page #profileHelpPanel.profile-help-panel .info-overlay-card::before {
            background: rgba(7,13,14,.84) !important;
          }
          @media (prefers-reduced-motion: reduce) {
            .contact-signal-track i {
              --r7-contact-shift: 0px;
              animation: none !important;
              transform: none !important;
              opacity: .78 !important;
              box-shadow: 0 0 9px rgba(155,196,199,.46) !important;
              will-change: auto;
            }
          }
          '''
          css.write_text(s,encoding='utf-8')

          js=Path('js/responsive-r7.js')
          j=js.read_text(encoding='utf-8')
          a="""    const prompt = $('#dossierPrompt', cast || document);\n    if (!cast || !prompt) return;\n\n    const sync = () => {\n"""
          b="""    const prompt = $('#dossierPrompt', cast || document);\n    if (!cast || !prompt) return;\n\n    let wasActionable = false;\n    let openScroll = null;\n\n    const sync = () => {\n"""
          if j.count(a)!=1: raise SystemExit(f'actor vars match count={j.count(a)}')
          j=j.replace(a,b,1)

          a="""      const actionable = isSequentialContext() && cast.classList.contains('r7-dossier-open');\n      prompt.classList.toggle('r7-subject-return', actionable);\n"""
          b="""      const actionable = isSequentialContext() && cast.classList.contains('r7-dossier-open');\n      if (actionable && !wasActionable) openScroll = { x: scrollX, y: scrollY };\n      if (!actionable) openScroll = null;\n      wasActionable = actionable;\n      prompt.classList.toggle('r7-subject-return', actionable);\n"""
          if j.count(a)!=1: raise SystemExit(f'actor sync match count={j.count(a)}')
          j=j.replace(a,b,1)

          a="""    const activate = event => {\n      if (!prompt.classList.contains('r7-subject-return')) return;\n      if (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ') return;\n      if (event.type === 'keydown') event.preventDefault();\n      $('.r7-subject-back', cast)?.click();\n    };\n"""
          b="""    const activate = event => {\n      if (!prompt.classList.contains('r7-subject-return')) return;\n      if (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ') return;\n      if (event.type === 'keydown') event.preventDefault();\n\n      const current = { x: scrollX, y: scrollY };\n      const smallIncidentalDrift = openScroll && Math.abs(current.y - openScroll.y) <= 24;\n      const targetScroll = smallIncidentalDrift ? openScroll : current;\n      $('.r7-subject-back', cast)?.click();\n\n      const restore = () => {\n        if (!isSequentialContext()) return;\n        if (Math.abs(scrollX - targetScroll.x) <= .5 && Math.abs(scrollY - targetScroll.y) <= .5) return;\n        scrollTo({ left: targetScroll.x, top: targetScroll.y, behavior: 'auto' });\n      };\n      requestAnimationFrame(() => requestAnimationFrame(restore));\n      setTimeout(restore, 90);\n    };\n"""
          if j.count(a)!=1: raise SystemExit(f'actor activate match count={j.count(a)}')
          js.write_text(j.replace(a,b,1),encoding='utf-8')

          def append_once(path, marker, block):
              p=Path(path); data=p.read_text(encoding='utf-8')
              if marker in data: raise SystemExit(f'{path}: duplicate marker {marker}')
              p.write_text(data.rstrip()+"\n\n"+block.strip()+"\n",encoding='utf-8')

          append_once('docs/current/DECISIONS.md','## Privacy by design — active direction addendum — 2026-09-12',r'''
          ## Privacy by design — active direction addendum — 2026-09-12

          This is an active project direction and a documentation decision, not a claim that a final Privacy Policy has already been legally approved or published.

          - Move toward a Russian-hosted backend as the intended infrastructure direction.
          - Do not require real visitor names.
          - Do not require visitor email addresses or phone numbers for ordinary public participation.
          - Raw IP addresses must not be used or stored as ordinary product/application data and must not become a user identity or product-feature primitive.
          - Infrastructure/network providers may still technically observe network IP addresses; project documentation must not claim that this can never happen.
          - Keep only the minimum technical identity required for review ownership/editing and related abuse-prevention integrity.
          - Use clear, informed consent where legally required.
          - Provide a practical way to delete user-associated data.
          - Continue data minimization by default.

          **Personal-data operator — provisional assumption only:** the film author is the current working assumption. This is not yet a final legal publication. The author's legal identity/details/contact have not been confirmed for publication, and the actual operator/processor allocation must be confirmed before a final Privacy Policy is published. Do not publish guessed legal details. Ordinary team members or the technical developer are not automatically designated the operator merely because they implement or maintain the system.

          The FAQ item `На сайте есть безопасность?` remains untouched as intentional artistic wordplay. It is not the legal Privacy Policy and must not be treated as one.
          ''')

          append_once('docs/current/ROADMAP.md','## Privacy-by-design backend/legal follow-up — added 2026-09-12',r'''
          ## Privacy-by-design backend/legal follow-up — added 2026-09-12

          Future backend migration and privacy-policy work must preserve the active privacy direction in `DECISIONS.md`: Russian-hosted backend direction; no required real names/email/phone for ordinary visitors; no application identity/features built around raw IP; minimum technical review identity; informed consent where legally required; deletion path for user-associated data; data minimization by default.

          Before final Privacy Policy publication, confirm the legal identity/contact details of the film author and confirm the actual operator/processor allocation. The current operator assumption (film author) is provisional only. Do not infer or publish legal details from technical ownership or team participation.

          Infrastructure providers may technically observe network IP addresses even though the application itself must not use/store raw IP as ordinary product data. The artistic FAQ wording `На сайте есть безопасность?` remains separate from legal privacy documentation.

          This addendum does **not** authorize or perform a backend migration, CAPTCHA deployment, Telegram integration, Bug Reports v2 implementation, or Supabase production change in Round 4.
          ''')
          PY
          git diff --check

      - name: Prepare deterministic browser QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/r7-round4-qa.cjs')
          s=p.read_text(encoding='utf-8')

          a="""async function go(page,url){\n  await page.goto(url,{waitUntil:'domcontentloaded'});\n  await page.waitForTimeout(850);\n}\n"""
          b="""async function ensureLang(page,target){\n  const current=await page.evaluate(()=>document.documentElement.lang || 'ru');\n  if(current===target) return;\n  const toggle=page.locator('#langToggle');\n  if(await toggle.count()){ await toggle.click(); await page.waitForTimeout(120); }\n  const after=await page.evaluate(()=>document.documentElement.lang || 'ru');\n  if(after!==target) throw new Error(`Unable to set language ${target}; current=${after}`);\n}\nasync function go(page,url){\n  await page.goto(url,{waitUntil:'domcontentloaded'});\n  await page.waitForTimeout(850);\n  await ensureLang(page,'ru');\n}\n"""
          if s.count(a)!=1: raise SystemExit(f'go QA match count={s.count(a)}')
          s=s.replace(a,b,1)

          a="""  const y0=await p.evaluate(()=>scrollY);\n  await toggle.click(); await sleep(160);\n"""
          b="""  await toggle.scrollIntoViewIfNeeded(); await sleep(100);\n  const y0=await p.evaluate(()=>scrollY);\n  await toggle.click(); await sleep(160);\n"""
          if s.count(a)!=1: raise SystemExit(f'profile QA match count={s.count(a)}')
          s=s.replace(a,b,1)

          a="""  await prompt.click(); await sleep(140);\n  const y2=await p.evaluate(()=>scrollY);\n  check(`${vp.name} actor prompt same return state`,!(await p.locator('#cast').evaluate(e=>e.classList.contains('r7-dossier-open'))),`scroll=${y1}->${y2}`);\n  check(`${vp.name} actor prompt return no scroll`,Math.abs(y2-y1)<=2,`${y1}->${y2}`);\n  await first.click(); await sleep(120);\n  await prompt.focus(); await prompt.press('Enter'); await sleep(120);\n  check(`${vp.name} actor keyboard Enter returns`,!(await p.locator('#cast').evaluate(e=>e.classList.contains('r7-dossier-open'))));\n"""
          b="""  await prompt.tap(); await sleep(160);\n  const y2=await p.evaluate(()=>scrollY);\n  check(`${vp.name} actor prompt same return state`,!(await p.locator('#cast').evaluate(e=>e.classList.contains('r7-dossier-open'))),`scroll=${y1}->${y2}`);\n  check(`${vp.name} actor prompt return no scroll`,Math.abs(y2-y1)<=1,`${y1}->${y2}`);\n\n  await first.tap(); await sleep(120);\n  const mainBack=p.locator('#cast .r7-subject-back');\n  await mainBack.scrollIntoViewIfNeeded(); await sleep(80);\n  const ym0=await p.evaluate(()=>scrollY);\n  await mainBack.tap(); await sleep(140);\n  const ym1=await p.evaluate(()=>scrollY);\n  check(`${vp.name} main SUBJECT INDEX still returns`,!(await p.locator('#cast').evaluate(e=>e.classList.contains('r7-dossier-open'))));\n  check(`${vp.name} main SUBJECT INDEX no scroll`,Math.abs(ym1-ym0)<=2,`${ym0}->${ym1}`);\n\n  await first.tap(); await sleep(120);\n  await p.evaluate(()=>document.querySelector('#dossierPrompt')?.focus({preventScroll:true}));\n  const yk0=await p.evaluate(()=>scrollY);\n  await prompt.press('Enter'); await sleep(140);\n  const yk1=await p.evaluate(()=>scrollY);\n  check(`${vp.name} actor keyboard Enter returns`,!(await p.locator('#cast').evaluate(e=>e.classList.contains('r7-dossier-open'))));\n  check(`${vp.name} actor keyboard return no scroll`,Math.abs(yk1-yk0)<=1,`${yk0}->${yk1}`);\n"""
          if s.count(a)!=1: raise SystemExit(f'actor QA match count={s.count(a)}')
          s=s.replace(a,b,1)

          a="""  check(`${vp.name} smart header visible at top`,atTop.smart&&!atTop.hidden,JSON.stringify(atTop));\n  await p.evaluate(()=>scrollTo(0,260));await sleep(360);\n"""
          b="""  check(`${vp.name} smart header visible at top`,atTop.smart&&!atTop.hidden,JSON.stringify(atTop));\n  await sleep(1050); // allow intentional header-interaction guard to expire\n  await p.evaluate(()=>scrollTo(0,260));await sleep(360);\n"""
          if s.count(a)!=1: raise SystemExit(f'header QA match count={s.count(a)}')
          s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate scoped tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed={
            'css/responsive-r7-polish.css','index.html','js/responsive-r7.js','reviews.html',
            'docs/current/BACKLOG.md','docs/current/DECISIONS.md','docs/current/ROADMAP.md','docs/current/VISUAL-SYSTEM.md',
            'docs/releases/revival/R7/OWNER-FEEDBACK-ROUND4.md','docs/releases/revival/R7/PREVIEW-HANDOFF.md',
            '.github/workflows/r7-round4-final-v2.yml','qa/r7-round4-patch.py','qa/r7-round4-qa.cjs'
          }
          paths={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1'],text=True).splitlines()}
          unexpected=paths-allowed
          if unexpected: raise SystemExit(f'unexpected Round4 paths: {sorted(unexpected)}')
          required={
            'css/responsive-r7-polish.css','index.html','js/responsive-r7.js','reviews.html',
            'docs/current/BACKLOG.md','docs/current/DECISIONS.md','docs/current/ROADMAP.md','docs/current/VISUAL-SYSTEM.md',
            'docs/releases/revival/R7/OWNER-FEEDBACK-ROUND4.md','docs/releases/revival/R7/PREVIEW-HANDOFF.md'
          }
          if required-paths: raise SystemExit(f'missing expected paths: {sorted(required-paths)}')
          PY
          grep -q 'smallIncidentalDrift' js/responsive-r7.js
          grep -q 'Privacy by design — active direction addendum — 2026-09-12' docs/current/DECISIONS.md
          grep -q 'Privacy-by-design backend/legal follow-up — added 2026-09-12' docs/current/ROADMAP.md
          git diff --quiet a97faa551aba14df059bec815445fd1200dc8360 -- js/public-response.js js/site.js

      - name: Install Chromium QA runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r7qa && cd /tmp/r7qa
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Run full required browser matrix
        shell: bash
        env:
          NODE_PATH: /tmp/r7qa/node_modules
        run: |
          set -euo pipefail
          rm -rf /tmp/r7-round4-precommit && mkdir -p /tmp/r7-round4-precommit
          python3 -m http.server 4182 --directory /tmp/r7-before >/tmp/r7-before-http.log 2>&1 &
          python3 -m http.server 4183 --directory "$GITHUB_WORKSPACE" >/tmp/r7-after-http.log 2>&1 &
          sleep 1
          R7_OUT=/tmp/r7-round4-precommit R7_BASE=http://127.0.0.1:4183 R7_BEFORE=http://127.0.0.1:4182 node /tmp/r7-round4-qa.cjs

      - name: Create clean final Round4 implementation doc commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/releases/revival/R7/OWNER-FEEDBACK-ROUND4.md')
          s=p.read_text(encoding='utf-8')
          marker='`__ROUND4_QA_EVIDENCE__`'
          if s.count(marker)!=1: raise SystemExit(f'QA marker count={s.count(marker)}')
          report=Path('/tmp/r7-round4-precommit/REPORT.md').read_text(encoding='utf-8')
          s=s.replace('Status: **IMPLEMENTED ON FEATURE BRANCH / BROWSER QA PENDING AT DOCUMENT-CREATION STEP / OWNER VISUAL REVIEW PENDING / NOT PRODUCTION**','Status: **IMPLEMENTED ON FEATURE BRANCH / FULL BROWSER MATRIX PASSED / EXACT-FINAL-SHA VERIFICATION FOLLOWS THIS COMMIT / OWNER VISUAL REVIEW PENDING / NOT PRODUCTION**',1)
          p.write_text(s.replace(marker,report,1),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add css/responsive-r7-polish.css index.html js/responsive-r7.js reviews.html \
            docs/releases/revival/R7/OWNER-FEEDBACK-ROUND4.md docs/releases/revival/R7/PREVIEW-HANDOFF.md \
            docs/current/DECISIONS.md docs/current/VISUAL-SYSTEM.md docs/current/ROADMAP.md docs/current/BACKLOG.md
          git rm .github/workflows/r7-round4-final-v2.yml qa/r7-round4-patch.py qa/r7-round4-qa.cjs
          git diff --cached --check
          git commit -m 'REVIVAL R7: owner feedback round 4'
          git rev-parse HEAD >/tmp/r7-round4-final-sha.txt
          test -z "$(git status --porcelain)"

      - name: Exact-final-SHA full browser verification
        shell: bash
        env:
          NODE_PATH: /tmp/r7qa/node_modules
        run: |
          set -euo pipefail
          FINAL_SHA="$(cat /tmp/r7-round4-final-sha.txt)"
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          rm -rf /tmp/r7-round4-final-evidence && mkdir -p /tmp/r7-round4-final-evidence
          R7_OUT=/tmp/r7-round4-final-evidence R7_BASE=http://127.0.0.1:4183 R7_BEFORE=http://127.0.0.1:4182 R7_EXACT_SHA="$FINAL_SHA" node /tmp/r7-round4-qa.cjs
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test -z "$(git status --porcelain)"
          cp /tmp/r7-round4-final-sha.txt /tmp/r7-round4-final-evidence/FINAL_SHA.txt

      - name: Push exact verified final commit
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="$(cat /tmp/r7-round4-final-sha.txt)"
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          git push origin HEAD:revival-r7-responsive-mobile
          test "$(git ls-remote origin refs/heads/revival-r7-responsive-mobile | cut -f1)" = "$FINAL_SHA"
          echo "FINAL_SHA=$FINAL_SHA"

      - name: Upload exact-final-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-round4-exact-final-browser-evidence
          path: /tmp/r7-round4-final-evidence
          if-no-files-found: warn
