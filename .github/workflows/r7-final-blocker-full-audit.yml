name: R7 final blocker full cross-engine audit

on:
  push:
    branches:
      - revival-r7-responsive-mobile
    paths:
      - .github/workflows/r7-final-blocker-full-audit.yml

permissions:
  contents: read

jobs:
  full-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard and mount exact product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=3fe6265505e6c287061aeae2c6f45c1e66af6bdb
          git merge-base --is-ancestor "$PRODUCT" HEAD
          test -z "$(git diff --name-only "$PRODUCT"..HEAD -- index.html reviews.html admin assets css js supabase migrations | sed -n '1p')"
          git worktree add /tmp/r7-product "$PRODUCT"
          printf '%s\n' "$PRODUCT" >/tmp/R7_PRODUCT_SHA.txt
          printf '%s\n' "$(git rev-parse HEAD)" >/tmp/AUDIT_TRIGGER_HEAD.txt

      - name: Install browser runtime and restore authoritative harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r7qa
          cd /tmp/r7qa
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit >/dev/null 2>&1
          echo '' | base64 -d | gzip -d >/tmp/r7_post_final_audit.cjs
          NODE_PATH=/tmp/r7qa/node_modules node --check /tmp/r7_post_final_audit.cjs

      - name: Run immutable product stability audit
        id: audit
        shell: bash
        env:
          NODE_PATH: /tmp/r7qa/node_modules
        run: |
          set -euo pipefail
          OUT=/tmp/r7-final-blocker-full-audit
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp /tmp/R7_PRODUCT_SHA.txt "$OUT/"
          cp /tmp/AUDIT_TRIGGER_HEAD.txt "$OUT/"
          cp /tmp/r7_post_final_audit.cjs "$OUT/HARNESS-SOURCE.cjs"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/r7-product >/tmp/r7-full-server.log 2>&1 & SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          sleep 1
          set +e
          timeout 1500s env BASE_URL=http://127.0.0.1:4173 PRODUCT_SHA=3fe6265505e6c287061aeae2c6f45c1e66af6bdb EVIDENCE_DIR="$OUT" node /tmp/r7_post_final_audit.cjs
          STATUS=$?
          set -e
          printf '%s\n' "$STATUS" >"$OUT/AUDIT_EXIT_CODE.txt"
          cp /tmp/r7-full-server.log "$OUT/server.log"
          exit "$STATUS"

      - name: Upload authoritative final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-final-blocker-full-audit-evidence
          path: /tmp/r7-final-blocker-full-audit
          if-no-files-found: warn
