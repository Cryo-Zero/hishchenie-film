name: R7 owner round2 final once
on:
  push:
    branches: [revival-r7-responsive-mobile]
    paths: ['.github/workflows/r7-round2-final.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Run audit
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          sleep 2
          node qa/r7-round2-final.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-round2-final
          path: r7-round2-final-evidence
      - name: Cleanup
        if: always()
        run: |
          git config user.name "Cryo-Zero"
          git config user.email "Bogdan.Vedrentsov@gmail.com"
          rm -f qa/r7-round2-final.cjs .github/workflows/r7-round2-final.yml package.json package-lock.json
          git add -A
          if ! git diff --cached --quiet; then git commit -m "chore: remove temporary round2 final QA [skip ci]" && git push; fi