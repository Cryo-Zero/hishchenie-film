name: R7 Round3 final browser QA

on:
  push:
    branches:
      - revival-r7-responsive-mobile

permissions:
  contents: write

jobs:
  round3-final:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify baseline and temporary-only drift
        shell: bash
        run: |
          set -euo pipefail
          BASE=e5a5c26ff9be2ff7d845cbf8f14de77ef5ed83db
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE"..HEAD | sort > /tmp/r7-temp-files.txt
          cat >/tmp/r7-expected-temp.txt <<'EOF'
          .github/workflows/r7-round3-final-qa.yml
          qa/r7-round3-docs.py
          qa/r7-round3-final.cjs
          qa/r7-round3-patch.py
          EOF
          diff -u /tmp/r7-expected-temp.txt /tmp/r7-temp-files.txt
          git worktree add /tmp/r7-before "$BASE"

      - name: Apply Round3 patch in runner worktree
        run: python3 qa/r7-round3-patch.py

      - name: Install Chromium QA runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r7qa
          cd /tmp/r7qa
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Run real Chromium Round3 matrix
        shell: bash
        env:
          NODE_PATH: /tmp/r7qa/node_modules
        run: |
          set -euo pipefail
          mkdir -p /tmp/r7-round3-evidence/screenshots
          python3 -m http.server 4172 --directory /tmp/r7-before >/tmp/r7-before-http.log 2>&1 &
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" >/tmp/r7-after-http.log 2>&1 &
          sleep 1
          node qa/r7-round3-final.cjs

      - name: Record passing Round3 docs and commit final tree
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/r7-round3-docs.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add css/responsive-r7-polish.css reviews.html \
            docs/releases/revival/R7/OWNER-FEEDBACK-ROUND3.md \
            docs/releases/revival/R7/PREVIEW-HANDOFF.md \
            docs/current/VISUAL-SYSTEM.md docs/current/ROADMAP.md
          git rm qa/r7-round3-patch.py qa/r7-round3-final.cjs qa/r7-round3-docs.py .github/workflows/r7-round3-final-qa.yml
          git diff --cached --check
          git commit -m "REVIVAL R7: owner feedback round 3"
          git push origin HEAD:revival-r7-responsive-mobile
          git rev-parse HEAD | tee /tmp/r7-round3-evidence/FINAL_SHA.txt

      - name: Upload Round3 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-round3-final-browser-evidence
          path: /tmp/r7-round3-evidence
          if-no-files-found: warn
