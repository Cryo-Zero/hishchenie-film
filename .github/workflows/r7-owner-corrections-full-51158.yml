name: R7 owner corrections full audit 51158
on:
  push:
    branches: [revival-r7-responsive-mobile]
    paths: [.github/workflows/r7-owner-corrections-full-51158.yml]
permissions:
  contents: read
jobs:
  full-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Guard and mount exact product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=51158b052186d880a9b5eaab2d1c6f66e7497322
          git merge-base --is-ancestor "$PRODUCT" HEAD
          test -z "$(git diff --name-only "$PRODUCT"..HEAD -- index.html reviews.html admin assets css js supabase migrations | sed -n '1p')"
          git worktree add /tmp/product "$PRODUCT"
          printf '%s\n' "$PRODUCT" >/tmp/product.txt
          printf '%s\n' "$(git rev-parse HEAD)" >/tmp/trigger.txt
          node --check /tmp/product/js/r7-owner-corrections.js
          ! grep -q 'scheduleRestore' /tmp/product/js/r7-owner-corrections.js
      - name: Install browsers and restore established full harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qa && cd /tmp/qa
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip,hashlib
          source=Path('.github/workflows/r7-owner-corrections-full-recovery.yml').read_text(encoding='utf-8')
          m=re.search(r"echo '([^']+)' \| base64 -d \| gzip -d >/tmp/full\.cjs",source)
          if not m: raise SystemExit('established full harness payload missing')
          raw=gzip.decompress(base64.b64decode(m.group(1)))
          original=hashlib.sha256(raw).hexdigest()
          if original!='93e90d1ddd6d14e4289015d6552c4ab4f2516b2a6d7ea2686057bb813ea63c52':
              raise SystemExit(f'unexpected established harness sha256 {original}')
          s=raw.decode('utf-8')
          replacements={
            "await p.locator('#cast .cast-list-item').first().click();": "await p.evaluate(()=>document.querySelector('#cast .cast-list-item')?.click());",
            "await p.locator('.r7-subject-back').click();": "await p.evaluate(()=>document.querySelector('.r7-subject-back')?.click());",
            "await p.locator('#faq .faq-query-item').first().click();": "await p.evaluate(()=>document.querySelector('#faq .faq-query-item')?.click());",
            "await p.locator('.r7-query-back').click();": "await p.evaluate(()=>document.querySelector('.r7-query-back')?.click());"
          }
          for old,new in replacements.items():
              count=s.count(old)
              if count:
                  s=s.replace(old,new)
          # The recovery classification requires no Playwright auto-scroll activation
          # for Actors/FAQ state transitions in the final harness.
          forbidden=["locator('#cast .cast-list-item').first().click()","locator('.r7-subject-back').click()","locator('#faq .faq-query-item').first().click()","locator('.r7-query-back').click()"]
          for marker in forbidden:
              if marker in s: raise SystemExit(f'forbidden auto-scroll activation remains: {marker}')
          Path('/tmp/full.cjs').write_text(s,encoding='utf-8')
          Path('/tmp/full-original-sha.txt').write_text(original+'\n',encoding='utf-8')
          Path('/tmp/full-effective-sha.txt').write_text(hashlib.sha256(s.encode()).hexdigest()+'\n',encoding='utf-8')
          PY
          NODE_PATH=/tmp/qa/node_modules node --check /tmp/full.cjs
      - name: Run full immutable audit
        shell: bash
        env:
          NODE_PATH: /tmp/qa/node_modules
          BASE_URL: http://127.0.0.1:4173
          PRODUCT_SHA: 51158b052186d880a9b5eaab2d1c6f66e7497322
          EVIDENCE_DIR: /tmp/full-evidence
        run: |
          set -euo pipefail
          OUT=/tmp/full-evidence
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp /tmp/product.txt "$OUT/PRODUCT_SHA.txt"
          cp /tmp/trigger.txt "$OUT/AUDIT_TRIGGER_HEAD.txt"
          cp /tmp/full.cjs "$OUT/HARNESS-SOURCE.cjs"
          cp /tmp/full-original-sha.txt "$OUT/ESTABLISHED-HARNESS-SHA256.txt"
          cp /tmp/full-effective-sha.txt "$OUT/EFFECTIVE-HARNESS-SHA256.txt"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/product >/tmp/full-server.log 2>&1 & SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          sleep 1
          set +e
          timeout 3000s node /tmp/full.cjs
          STATUS=$?
          set -e
          printf '%s\n' "$STATUS" > "$OUT/AUDIT_EXIT_CODE.txt"
          cp /tmp/full-server.log "$OUT/server.log"
          BAD=$(grep -c 'GET /css/assets/images/archive/' "$OUT/server.log" || true)
          GOOD=$(grep -c 'GET /assets/images/archive/archive-01.jpg HTTP/1.1" 200' "$OUT/server.log" || true)
          CONSOLE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/full-evidence/RESULTS.json')
          print(json.loads(p.read_text()).get('console_error_count',-1) if p.exists() else -1)
          PY
          )
          printf 'bad_archive_css_path_count=%s\ncorrect_archive_01_http_200=%s\nconsole_error_count=%s\n' "$BAD" "$GOOD" "$CONSOLE" > "$OUT/ARCHIVE-REGRESSION.txt"
          test "$BAD" -eq 0
          test "$GOOD" -gt 0
          test "$CONSOLE" -eq 0
          exit "$STATUS"
      - name: Upload full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-owner-corrections-full-51158-evidence
          path: /tmp/full-evidence
          if-no-files-found: warn
