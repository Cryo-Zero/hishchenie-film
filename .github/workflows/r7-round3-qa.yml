low and JS errors.\n- Bug Reports v2/backend/admin notifications remain **OPEN DISCUSSION** and are out of scope.\n\n## Implementation\n\n- Removed the Reviews-only fixed-header override and explicitly kept feed toolbar/settings/sort in normal flow on compact layouts.\n- Removed the visible profanity-filter explanatory `<small>` from `reviews.html`; i18n data may remain for compatibility but is no longer rendered.\n- Replaced compact Archive aspect-driven stage sizing with stable viewport-based geometry; removed the now-unused natural-image-aspect synchronizer from `js/responsive-r7.js`.\n- Reduced portrait/landscape Archive drawer dimensions, enabled internal thumbnail scrolling and kept the Materials-local activation contract.\n- Replaced `contactTravel` use with a fixed endpoint pulse and an explicit reduced-motion static state.\n- Raised only information-bearing microcopy groups; decorative watermarks and normal body/display typography were not globally inflated.\n- Show More implementation was not changed.\n\n## Superseded R7 preview behavior\n\nHistorical Round1/Round2 context remains in prior handoff/feedback records, but active Round3 behavior supersedes:\n\n1. **fixed/sticky Reviews mobile presentation while reading the long feed** → review feed controls now scroll in normal document flow;\n2. **image-natural-aspect-driven compact Archive stage height** → compact stage height is stable across assets while each image remains contained without distortion.\n\n## Contact indicator rule\n\nThe CONTACT endpoint dot is spatially fixed near the right endpoint. Animation may change opacity/glow only; horizontal movement (`left`, `translateX`) is not part of the active rule. Reduced motion disables the pulse.\n\n## Readability direction\n\nInformation-bearing terminal/system microcopy must remain visually subordinate but readable. Do not mechanically increase every font. The smallest functional/status/meta class gets a meaningful floor by context; `SIGNAL // STABLE` remains a separate secondary class. Any future adjustment must preserve world-grid geometry and avoid clipping/overflow.\n\n## Computed typography evidence\n\n```json\n{json.dumps(typography, indent=2)}\n```\n\n## Browser QA evidence\n\n{report}\n\nScreenshots are attached to the temporary GitHub Actions artifact for this Round3 QA run. The QA harness/dependencies are temporary and must not remain in the final feature-tree.\n\n## Gate\n\nRound3 is still a **draft R7 preview**. Browser QA passing is implementation evidence, not owner visual acceptance. Owner review is still required before R7 merge/production.\n'''
          Path('docs/releases/revival/R7/OWNER-FEEDBACK-ROUND3.md').write_text(round3)

          def append_once(path, marker, text):
              p=Path(path); s=p.read_text()
              if marker in s: raise SystemExit(f'marker already exists in {path}')
              p.write_text(s.rstrip()+"\n\n"+text.strip()+"\n")

          append_once('docs/releases/revival/R7/PREVIEW-HANDOFF.md','## Owner feedback round 3 — 2026-09-11',f'''## Owner feedback round 3 — 2026-09-11\n\nRound3 preserves the earlier owner-feedback record as history while superseding two active preview choices:\n\n- the Reviews mobile feed controls no longer remain fixed/sticky while reading; `PUBLIC FEED`, channel/records, sort controls and profanity toggle now leave the viewport in normal document flow;\n- the compact Archive stage no longer follows each selected asset's natural aspect ratio; the stage geometry is stable across the asset set and images remain centered with `object-fit: contain`.\n\nAdditional Round3 changes:\n\n- the visible profanity-filter explanatory hint was removed in RU/EN while keeping the toggle;\n- phone Archive drawer footprint was reduced and its thumbnail area scrolls internally; ARCHIVE remains a Materials-local left-wall control;\n- CONTACT dot is fixed at the right endpoint and uses a calm opacity/glow pulse, with no horizontal travel and a static reduced-motion state;\n- information-bearing microcopy received a second targeted readability pass; decorative watermarks were not globally enlarged;\n- Show More behavior was retained unchanged.\n\nReal Chromium QA at `390×844`, `430×932`, `844×390`, `932×430`, `1366×768` passed the Round3 checks recorded in `OWNER-FEEDBACK-ROUND3.md`, including all 11 Archive assets, stable stage geometry, Reviews flow/Show More, RU/EN hint removal, Contact X stability, typography before→after, horizontal overflow and page JS errors.\n\n**Bug Reports v2/backend/admin notifications remain OPEN DISCUSSION and were not implemented in Round3.**\n\nRound3 remains **OWNER VISUAL REVIEW PENDING / NOT PRODUCTION**. QA evidence must not be described as owner visual acceptance.''')

          append_once('docs/current/VISUAL-SYSTEM.md','## R7 Round 3 preview refinements — owner-directed, not production', '''## R7 Round 3 preview refinements — owner-directed, not production\n\nThese are durable owner-directed rules for the R7 preview; R7 is not production until separately accepted/merged.\n\n- On compact/mobile Reviews, public-feed heading/status/records, New/Old/Popular and profanity toggle belong to normal document flow and must not occupy permanent sticky/fixed space while the user reads the feed.\n- For compact Materials, mixed image aspect ratios must not move the page: the main stage uses stable geometry while assets preserve their own proportions through centered `object-fit: contain`. Free space inside the stable stage is preferable to stretching/cropping.\n- ARCHIVE remains the intentional Materials left-wall exception, but its open phone drawer must be compact/non-fullscreen and internally scrollable, especially in low-height landscape.\n- CONTACT's small endpoint indicator remains physically fixed near the right endpoint/diamond. Signal animation may pulse/fade/glow but must not travel horizontally or visibly teleport on loop.\n- Information-bearing microcopy must stay subordinate **and readable**. Do not solve this with a global font-size increase: target the small functional/status/meta class, preserve hierarchy and verify geometry in browser. Decorative watermarks are not part of this rule.\n- Substantial responsive changes remain subject to concept/direction approval where practical, and final acceptance must use actual browser rendering rather than mockup-only evidence.''')

          append_once('docs/current/ROADMAP.md','### Owner feedback round 3 — implemented on draft R7 branch', '''### Owner feedback round 3 — implemented on draft R7 branch\n\nRound3 owner corrections implemented and browser-QA'd on `revival-r7-responsive-mobile`:\n\n- Reviews compact feed controls return to normal flow; previous fixed/sticky preview choice retained only as history;\n- profanity explanatory hint removed from visible UI;\n- compact Archive drawer reduced; all-asset stage geometry stabilized without image distortion;\n- CONTACT horizontal dot travel replaced by fixed endpoint pulse;\n- targeted information-bearing microcopy readability pass completed;\n- Show More regression retained;\n- required phone/landscape/desktop Chromium matrix passed.\n\nNext gate: **owner visual review of Round3 preview**. Do not merge R7, publish mobile, begin Bug Reports v2/admin notifications, or treat browser QA as owner visual acceptance without a separate explicit decision.''')
          PY
