name: R7 owner corrections semantic recovery cycles

on:
  push:
    branches:
      - revival-r7-responsive-mobile
    paths:
      - .github/workflows/r7-owner-corrections-recovery-cycles.yml

permissions:
  contents: read

jobs:
  recovery-cycles:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=66c31fa36896b3b968799ec154fd3bbdb6f4a2e5
          git merge-base --is-ancestor "$PRODUCT" HEAD
          test -z "$(git diff --name-only "$PRODUCT"..HEAD -- index.html reviews.html admin assets css js supabase migrations | sed -n '1p')"
          git worktree add /tmp/r7-owner-product "$PRODUCT"
          printf '%s\n' "$PRODUCT" >/tmp/PRODUCT_SHA.txt
          printf '%s\n' "$(git rev-parse HEAD)" >/tmp/AUDIT_TRIGGER_HEAD.txt
          ! grep -q 'scheduleRestore' /tmp/r7-owner-product/js/r7-owner-corrections.js

      - name: Install browsers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r7qa && cd /tmp/r7qa
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit >/dev/null 2>&1

      - name: Write semantic cycle harness
        shell: bash
        run: |
          cat > /tmp/r7-recovery-cycles.cjs <<'NODE'
          const {chromium, firefox, webkit} = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const BASE = process.env.BASE_URL || 'http://127.0.0.1:4175';
          const PRODUCT_SHA = process.env.PRODUCT_SHA || '';
          const OUT = process.env.EVIDENCE_DIR || '/tmp/r7-recovery-cycles';
          const browsers = {chromium, firefox, webkit};
          const viewports = [
            {name:'390x844',width:390,height:844},
            {name:'430x932',width:430,height:932},
            {name:'844x390',width:844,height:390}
          ];
          const cycles = 4;
          const results = [], errors = [];
          const add=(ok,browser,viewport,name,detail={})=>{results.push({ok,browser,viewport,name,detail});if(!ok)console.log('FAIL',browser,viewport,name,JSON.stringify(detail));};
          const near=(a,b,t=1)=>Math.abs(a-b)<=t;
          const sameLayout=(a,b,t=.5)=>Array.isArray(a)&&Array.isArray(b)&&a.length===b.length&&a.every((x,i)=>['top','left','width','height'].every(k=>Math.abs(x[k]-b[i][k])<=t));
          (async()=>{
            for(const [browserName,browserType] of Object.entries(browsers)){
              const browser=await browserType.launch({headless:true});
              try{
                for(const v of viewports){
                  const context=await browser.newContext({viewport:{width:v.width,height:v.height},hasTouch:true,...(browserName!=='firefox'?{isMobile:true}:{})});
                  const p=await context.newPage();
                  p.on('pageerror',e=>errors.push({browser:browserName,viewport:v.name,error:String(e)}));
                  await p.goto(`${BASE}/index.html?recovery-cycles=1`,{waitUntil:'networkidle'});
                  await p.evaluate(()=>{document.documentElement.style.scrollBehavior='auto';});

                  await p.locator('#cast').evaluate(el=>el.scrollIntoView({block:'start'}));
                  await p.waitForTimeout(120);
                  for(let i=1;i<=cycles;i++){
                    const y0=await p.evaluate(()=>scrollY);
                    await p.evaluate(()=>document.querySelector('#cast .cast-list-item')?.click());
                    await p.waitForFunction(()=>document.querySelector('#cast')?.classList.contains('r7-dossier-open'));
                    await p.waitForTimeout(260);
                    const open=await p.evaluate(()=>({y:scrollY,minHeight:getComputedStyle(document.querySelector('#cast .cast-console')).minHeight,visible:getComputedStyle(document.querySelector('#cast .subject-dossier')).display!=='none'}));
                    add(near(y0,open.y),browserName,v.name,`Actors cycle ${i} open preserves scroll`,{before:y0,after:open.y});
                    add(open.minHeight==='0px',browserName,v.name,`Actors cycle ${i} has no phantom min-height`,open);
                    add(open.visible,browserName,v.name,`Actors cycle ${i} dossier visible`,open);
                    await p.evaluate(()=>document.querySelector('.r7-subject-back')?.click());
                    await p.waitForFunction(()=>!document.querySelector('#cast')?.classList.contains('r7-dossier-open'));
                    await p.waitForTimeout(260);
                    const back=await p.evaluate(()=>({y:scrollY,minHeight:getComputedStyle(document.querySelector('#cast .cast-console')).minHeight,rows:[...document.querySelectorAll('#cast .cast-list-item')].map(n=>n.getBoundingClientRect().height),visible:getComputedStyle(document.querySelector('#cast .cast-list')).display!=='none'}));
                    add(near(y0,back.y),browserName,v.name,`Actors cycle ${i} back preserves scroll`,{before:y0,after:back.y});
                    add(back.minHeight==='0px',browserName,v.name,`Actors cycle ${i} back has no phantom min-height`,back);
                    add(back.visible&&back.rows.every(h=>h>0),browserName,v.name,`Actors cycle ${i} returns to real subject-index geometry`,back);
                  }

                  await p.locator('#faq').evaluate(el=>el.scrollIntoView({block:'start'}));
                  await p.waitForTimeout(120);
                  const baselineRows=await p.evaluate(()=>[...document.querySelectorAll('#faq .faq-query-item')].map(n=>n.getBoundingClientRect().height));
                  for(let i=1;i<=cycles;i++){
                    const y0=await p.evaluate(()=>scrollY);
                    await p.evaluate(()=>document.querySelector('#faq .faq-query-item')?.click());
                    await p.waitForFunction(()=>document.querySelector('#faq')?.classList.contains('r7-response-open'));
                    await p.waitForTimeout(185);
                    const open1=await p.evaluate(()=>({y:scrollY,minHeight:getComputedStyle(document.querySelector('#faq .faq-console')).minHeight,visible:getComputedStyle(document.querySelector('#faq .faq-response-panel')).display!=='none',layout:[...document.querySelectorAll('#faq .faq-system-box > div, #faq .faq-response-log')].map(n=>({top:n.offsetTop,left:n.offsetLeft,width:n.offsetWidth,height:n.offsetHeight}))}));
                    await p.waitForTimeout(180);
                    const open2=await p.evaluate(()=>({y:scrollY,layout:[...document.querySelectorAll('#faq .faq-system-box > div, #faq .faq-response-log')].map(n=>({top:n.offsetTop,left:n.offsetLeft,width:n.offsetWidth,height:n.offsetHeight}))}));
                    add(near(y0,open1.y)&&near(y0,open2.y),browserName,v.name,`FAQ cycle ${i} open preserves scroll`,{before:y0,mid:open1.y,after:open2.y});
                    add(open1.minHeight==='0px',browserName,v.name,`FAQ cycle ${i} has no phantom min-height`,open1);
                    add(open1.visible,browserName,v.name,`FAQ cycle ${i} response visible`,open1);
                    add(sameLayout(open1.layout,open2.layout),browserName,v.name,`FAQ cycle ${i} structural layout stays stationary during reveal`,{first:open1.layout,second:open2.layout});
                    await p.evaluate(()=>document.querySelector('.r7-query-back')?.click());
                    await p.waitForFunction(()=>!document.querySelector('#faq')?.classList.contains('r7-response-open'));
                    await p.waitForTimeout(260);
                    const back=await p.evaluate(()=>({y:scrollY,minHeight:getComputedStyle(document.querySelector('#faq .faq-console')).minHeight,rows:[...document.querySelectorAll('#faq .faq-query-item')].map(n=>n.getBoundingClientRect().height),visible:getComputedStyle(document.querySelector('#faq .faq-query-list')).display!=='none'}));
                    add(near(y0,back.y),browserName,v.name,`FAQ cycle ${i} back preserves scroll`,{before:y0,after:back.y});
                    add(back.minHeight==='0px',browserName,v.name,`FAQ cycle ${i} back has no phantom min-height`,back);
                    add(back.visible&&back.rows.length===baselineRows.length&&back.rows.every((h,j)=>near(h,baselineRows[j],.75)),browserName,v.name,`FAQ cycle ${i} back returns directly to real query-index geometry`,{baseline:baselineRows,after:back.rows});
                  }
                  await context.close();
                }
              }finally{await browser.close();}
            }
            const failed=results.filter(x=>!x.ok);
            const summary={product_sha:PRODUCT_SHA,total:results.length,passed:results.length-failed.length,failed:failed.length,page_errors:errors.length,failures:failed,errors,viewports:viewports.map(v=>v.name),browsers:Object.keys(browsers),cycles_per_scene:cycles};
            fs.mkdirSync(OUT,{recursive:true});
            fs.writeFileSync(path.join(OUT,'RECOVERY-CYCLES.json'),JSON.stringify(summary,null,2));
            fs.writeFileSync(path.join(OUT,'RECOVERY-CYCLES.md'),`# R7 semantic recovery cycles\n\nProduct: ${PRODUCT_SHA}\n\nTotal: ${summary.total}\nPASS: ${summary.passed}\nFAIL: ${summary.failed}\nPage errors: ${summary.page_errors}\n`);
            console.log(JSON.stringify(summary,null,2));
            process.exit(failed.length||errors.length?1:0);
          })().catch(err=>{console.error(err);process.exit(2);});
          NODE
          NODE_PATH=/tmp/r7qa/node_modules node --check /tmp/r7-recovery-cycles.cjs

      - name: Run semantic recovery cycles
        shell: bash
        env:
          NODE_PATH: /tmp/r7qa/node_modules
          PRODUCT_SHA: 66c31fa36896b3b968799ec154fd3bbdb6f4a2e5
        run: |
          set -euo pipefail
          OUT=/tmp/r7-recovery-cycles
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp /tmp/PRODUCT_SHA.txt "$OUT/PRODUCT_SHA.txt"
          cp /tmp/AUDIT_TRIGGER_HEAD.txt "$OUT/AUDIT_TRIGGER_HEAD.txt"
          cp /tmp/r7-recovery-cycles.cjs "$OUT/RECOVERY-CYCLES-SOURCE.cjs"
          python3 -m http.server 4175 --bind 127.0.0.1 --directory /tmp/r7-owner-product >"$OUT/server.log" 2>&1 & SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          sleep 1
          set +e
          timeout 900s env BASE_URL=http://127.0.0.1:4175 PRODUCT_SHA="$PRODUCT_SHA" EVIDENCE_DIR="$OUT" node /tmp/r7-recovery-cycles.cjs
          STATUS=$?
          set -e
          printf '%s\n' "$STATUS" > "$OUT/AUDIT_EXIT_CODE.txt"
          test "$STATUS" -eq 0

      - name: Upload semantic recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-owner-corrections-semantic-recovery-cycles
          path: /tmp/r7-recovery-cycles
          if-no-files-found: warn
