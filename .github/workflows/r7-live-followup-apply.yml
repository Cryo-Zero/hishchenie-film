name: R7 live follow-up apply

on:
  push:
    branches: [r7-live-followup-pc-mobile]
    paths:
      - .github/workflows/r7-live-followup-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4e16c09f9704f634e443efadf042e3516465201a" || test "$(git rev-parse HEAD)" = "4e16c09f9704f634e443efadf042e3516465201a"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "4e16c09f9704f634e443efadf042e3516465201a"
      - name: Apply bounded follow-up
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1) Make the existing shared system reveal visibly readable rather than instantaneous.
          p=Path('js/site.js'); s=p.read_text()
          old="""  // Keep the old state visible while it softens. The new state is written
          // only after that short fade and starts partially visible, avoiding an
          // empty-panel flash while still reading as one continuous transformation.
          panel.classList.add('is-r7-crossfade-out');
          panel._theftRevealTimer = setTimeout(() => {
            if (typeof writeValues === 'function') writeValues();
            panel.classList.remove('is-r7-crossfade-out');
            panel.classList.add('is-r7-crossfade-in');
            void panel.offsetWidth;
            requestAnimationFrame(() => requestAnimationFrame(() => {
              panel.classList.remove('is-r7-crossfade-in');
              panel.classList.add('is-revealed');
            }));
          }, 140);
          """
          new="""  // Reverse-draw the current record first. The semantic value swap happens
          // only after that information is visually hidden; the new record then draws back in.
          // This keeps structural geometry stationary while making both directions legible.
          panel.classList.add('is-r7-crossfade-out');
          panel._theftRevealTimer = setTimeout(() => {
            if (typeof writeValues === 'function') writeValues();
            panel.classList.remove('is-r7-crossfade-out');
            panel.classList.add('is-r7-crossfade-in');
            void panel.offsetWidth;
            requestAnimationFrame(() => requestAnimationFrame(() => {
              panel.classList.remove('is-r7-crossfade-in');
              panel.classList.add('is-revealed');
            }));
          }, 320);
          """
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))

          # 2) Replace legacy mobile scroll/min-height forcing with real semantic states.
          p=Path('js/responsive-r7.js'); s=p.read_text()
          a=s.index('  // Sequential FAQ / Actors --------------------------------------------------')
          b=s.index('  // PROFILE HELP -------------------------------------------------------------')
          replacement=r'''  // Sequential FAQ / Actors --------------------------------------------------
          // Follow-up rule: never force viewport coordinates or fabricate a temporary height.
          // Keep the real detail state alive only long enough for its reverse reveal, then switch
          // to the real index geometry. Browser scroll anchoring is disabled by the follow-up CSS.
          const reverseRevealMs = 340;

          function makeBackButton(label, className) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = `r7-sequence-back ${className}`;
            button.textContent = `← ${label}`;
            return button;
          }

          const cast = $('#cast');
          if (cast) {
            const items = $$('.cast-list-item', cast);
            const dossier = $('#subjectDossier', cast);
            const close = $('#subjectDossierClose', cast);
            const topline = $('.dossier-topline', dossier || cast);
            let lastSelected = null;
            let closeTimer = 0;

            const finishClose = () => {
              const selected = items.find(item => item.getAttribute('aria-selected') === 'true') || null;
              if (selected) return;
              cast.classList.remove('r7-dossier-open');
              const target = cast._r7SequenceFocusTarget;
              cast._r7SequenceFocusTarget = null;
              requestAnimationFrame(() => target?.focus({ preventScroll: true }));
            };

            const back = dossier ? makeBackButton('SUBJECT INDEX', 'r7-subject-back') : null;
            if (back && dossier && !$('.r7-subject-back', dossier)) {
              dossier.insertBefore(back, topline || dossier.firstChild);
              back.addEventListener('click', () => {
                cast._r7SequenceFocusTarget = lastSelected || items[0];
                close?.click();
              });
            }

            function syncCast() {
              const selected = items.find(item => item.getAttribute('aria-selected') === 'true') || null;
              clearTimeout(closeTimer);
              if (selected) {
                cast.classList.add('r7-dossier-open');
                lastSelected = selected;
                return;
              }
              if (!cast.classList.contains('r7-dossier-open')) return;
              if (matchMedia('(prefers-reduced-motion: reduce)').matches) finishClose();
              else closeTimer = setTimeout(finishClose, reverseRevealMs);
            }

            items.forEach(item => item.addEventListener('click', () => queueMicrotask(syncCast)));
            close?.addEventListener('click', () => queueMicrotask(syncCast));

            const observer = new MutationObserver(syncCast);
            items.forEach(item => observer.observe(item, { attributes: true, attributeFilter: ['aria-selected', 'class'] }));
            syncCast();
          }

          const faq = $('#faq');
          if (faq) {
            const items = $$('.faq-query-item', faq);
            const panel = $('#faqResponsePanel', faq);
            const close = $('#faqResponseClose', faq);
            const header = $('.faq-response-header', panel || faq);
            let lastSelected = null;
            let closeTimer = 0;

            const finishClose = () => {
              const selected = items.find(item => item.getAttribute('aria-selected') === 'true') || null;
              if (selected) return;
              faq.classList.remove('r7-response-open');
              const target = faq._r7SequenceFocusTarget;
              faq._r7SequenceFocusTarget = null;
              requestAnimationFrame(() => target?.focus({ preventScroll: true }));
            };

            const back = panel ? makeBackButton('QUERY INDEX', 'r7-query-back') : null;
            if (back && panel && !$('.r7-query-back', panel)) {
              panel.insertBefore(back, header || panel.firstChild);
              back.addEventListener('click', () => {
                faq._r7SequenceFocusTarget = lastSelected || items[0];
                close?.click();
              });
            }

            function syncFaq() {
              const selected = items.find(item => item.getAttribute('aria-selected') === 'true') || null;
              clearTimeout(closeTimer);
              if (selected) {
                faq.classList.add('r7-response-open');
                lastSelected = selected;
                return;
              }
              if (!faq.classList.contains('r7-response-open')) return;
              if (matchMedia('(prefers-reduced-motion: reduce)').matches) finishClose();
              else closeTimer = setTimeout(finishClose, reverseRevealMs);
            }

            items.forEach(item => item.addEventListener('click', () => queueMicrotask(syncFaq)));
            close?.addEventListener('click', () => queueMicrotask(syncFaq));

            const observer = new MutationObserver(syncFaq);
            items.forEach(item => observer.observe(item, { attributes: true, attributeFilter: ['aria-selected', 'class'] }));
            if (panel) observer.observe(panel, { attributes: true, attributeFilter: ['class'] });
            syncFaq();
          }

'''
          s=s[:a]+replacement+s[b:]

          # 3) Dossier footer uses the same semantic back action; no timer-based scroll restoration.
          a=s.index('  // OWNER FEEDBACK ROUND 4 ---------------------------------------------------')
          b=s.index('  // Compact/phone Materials gets a horizontal control')
          prompt=r'''  // OWNER FOLLOW-UP — dossier footer uses the same semantic back action.
          function installSubjectPromptAction() {
            const cast = $('#cast');
            const prompt = $('#dossierPrompt', cast || document);
            if (!cast || !prompt) return;

            const sync = () => {
              const actionable = isSequentialContext() && cast.classList.contains('r7-dossier-open');
              prompt.classList.toggle('r7-subject-return', actionable);
              if (actionable) {
                prompt.setAttribute('role', 'button');
                prompt.setAttribute('tabindex', '0');
                prompt.setAttribute('aria-label', document.documentElement.lang === 'en'
                  ? 'Return to subject index'
                  : 'Вернуться к списку субъектов');
              } else {
                prompt.removeAttribute('role');
                prompt.removeAttribute('tabindex');
                prompt.removeAttribute('aria-label');
              }
            };

            const activate = event => {
              if (!prompt.classList.contains('r7-subject-return')) return;
              if (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ') return;
              if (event.type === 'keydown') event.preventDefault();
              $('.r7-subject-back', cast)?.click();
            };

            prompt.addEventListener('click', activate);
            prompt.addEventListener('keydown', activate);
            new MutationObserver(sync).observe(cast, { attributes: true, attributeFilter: ['class'] });
            addEventListener('theft:language', sync, { passive: true });
            addEventListener('resize', sync, { passive: true });
            sync();
          }

'''
          s=s[:a]+prompt+s[b:]
          p.write_text(s)

          # 4) Load one final bounded follow-up layer on both public pages.
          for name in ('index.html','reviews.html'):
              p=Path(name); s=p.read_text()
              css='css/r7-owner-corrections.css?v=r7-owner-20260916b'
              assert s.count(css)==1, (name,s.count(css))
              s=s.replace(f'<link rel="stylesheet" href="{css}">', f'<link rel="stylesheet" href="{css}">\n<link rel="stylesheet" href="css/r7-live-followup.css?v=20260917a">')
              js='<script src="js/r7-owner-corrections.js?v=r7-owner-20260916b"></script>'
              assert s.count(js)==1, (name,s.count(js))
              s=s.replace(js, js+'\n<script src="js/r7-live-followup.js?v=20260917a"></script>')
              p.write_text(s)
          PY

          cat > css/r7-live-followup.css <<'CSS'
          /* R7 LIVE FOLLOW-UP — owner-approved PC + mobile corrections, 2026-09-17. */

          /* Actors / FAQ: stationary structure, legible forward + reverse system draw. */
          #cast,
          #faq,
          body.r7-sequential-ui #cast .cast-console,
          body.r7-sequential-ui #faq .faq-console {
            overflow-anchor: none !important;
          }

          .subject-dossier .dossier-data small,
          .subject-dossier .dossier-data strong,
          .subject-dossier .dossier-subject,
          .subject-dossier .dossier-prompt,
          .faq-response-panel .faq-system-box > div > span,
          .faq-response-panel .faq-system-box > div > strong,
          .faq-response-panel .faq-response-log > span,
          .faq-response-panel .faq-response-content > h3,
          .faq-response-panel .faq-response-content > p {
            transform: none !important;
            transition-property: opacity, clip-path !important;
            transition-duration: .48s, .52s !important;
            transition-timing-function: linear, cubic-bezier(.2,.72,.2,1) !important;
          }
          .subject-dossier.is-r7-crossfade-out .dossier-data small,
          .subject-dossier.is-r7-crossfade-out .dossier-data strong,
          .subject-dossier.is-r7-crossfade-out .dossier-subject,
          .subject-dossier.is-r7-crossfade-out .dossier-prompt,
          .faq-response-panel.is-r7-crossfade-out .faq-system-box > div > span,
          .faq-response-panel.is-r7-crossfade-out .faq-system-box > div > strong,
          .faq-response-panel.is-r7-crossfade-out .faq-response-log > span,
          .faq-response-panel.is-r7-crossfade-out .faq-response-content > h3,
          .faq-response-panel.is-r7-crossfade-out .faq-response-content > p {
            opacity: .05 !important;
            clip-path: inset(0 0 100% 0) !important;
            transition-duration: .30s, .32s !important;
            transition-delay: 0s !important;
          }
          .subject-dossier.is-r7-crossfade-in .dossier-data small,
          .subject-dossier.is-r7-crossfade-in .dossier-data strong,
          .subject-dossier.is-r7-crossfade-in .dossier-subject,
          .subject-dossier.is-r7-crossfade-in .dossier-prompt,
          .faq-response-panel.is-r7-crossfade-in .faq-system-box > div > span,
          .faq-response-panel.is-r7-crossfade-in .faq-system-box > div > strong,
          .faq-response-panel.is-r7-crossfade-in .faq-response-log > span,
          .faq-response-panel.is-r7-crossfade-in .faq-response-content > h3,
          .faq-response-panel.is-r7-crossfade-in .faq-response-content > p {
            opacity: .05 !important;
            clip-path: inset(0 0 100% 0) !important;
            transition: none !important;
          }
          .subject-dossier.is-revealed .dossier-data > div:nth-child(1) > *,
          .faq-response-panel.is-revealed .faq-system-box > div:nth-child(1) > * { transition-delay: .02s !important; }
          .subject-dossier.is-revealed .dossier-data > div:nth-child(2) > *,
          .faq-response-panel.is-revealed .faq-system-box > div:nth-child(2) > * { transition-delay: .07s !important; }
          .subject-dossier.is-revealed .dossier-data > div:nth-child(3) > * { transition-delay: .12s !important; }
          .subject-dossier.is-revealed .dossier-data > div:nth-child(4) > * { transition-delay: .17s !important; }
          .faq-response-panel.is-revealed .faq-response-content > h3 { transition-delay: .08s !important; }
          .faq-response-panel.is-revealed .faq-response-content > p { transition-delay: .14s !important; }
          .subject-dossier.is-r7-crossfade-out *,
          .faq-response-panel.is-r7-crossfade-out * { transition-delay: 0s !important; }

          @media (max-width: 820px) {
            body.r7-sequential-ui #cast.r7-dossier-open .subject-dossier,
            body.r7-sequential-ui #cast:not(.r7-dossier-open) .cast-list,
            body.r7-sequential-ui #faq.r7-response-open .faq-response-panel,
            body.r7-sequential-ui #faq:not(.r7-response-open) .faq-query-list {
              animation: r7FollowupSemanticReveal .36s linear both !important;
            }
          }
          body.r7-phone-landscape #cast.r7-dossier-open .subject-dossier,
          body.r7-phone-landscape #cast:not(.r7-dossier-open) .cast-list,
          body.r7-phone-landscape #faq.r7-response-open .faq-response-panel,
          body.r7-phone-landscape #faq:not(.r7-response-open) .faq-query-list {
            animation: r7FollowupSemanticReveal .36s linear both !important;
          }
          @keyframes r7FollowupSemanticReveal {
            from { opacity:.18; clip-path:inset(0 0 5% 0); }
            to { opacity:1; clip-path:inset(0); }
          }

          /* Trailer: familiar hierarchy, quiet THEFT chrome, generous invisible hit areas. */
          .video-shell.r7-followup-player .r7-player-controls {
            padding: 48px 16px 12px !important;
            background: linear-gradient(to top,rgba(2,5,6,.92),rgba(2,5,6,.52) 55%,transparent) !important;
          }
          .r7-player-progress-row { margin-bottom: 6px !important; }
          .r7-player-row { gap: 14px !important; }
          .r7-player-left,.r7-player-right { gap: 6px !important; }
          .r7-player-button {
            width: 40px !important;
            height: 40px !important;
            min-width: 40px !important;
            border: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
            border-radius: 2px;
          }
          .r7-player-button:hover,
          .r7-player-button:focus-visible {
            border: 0 !important;
            background: rgba(155,196,199,.09) !important;
            box-shadow: none !important;
            outline: 1px solid rgba(155,196,199,.38) !important;
            outline-offset: -3px;
          }
          .r7-player-time { min-width: 86px !important; color:#c1cecf !important; }
          .r7-player-range { height: 24px !important; }
          .r7-player-range::-webkit-slider-runnable-track {
            height: 2px !important;
            background: linear-gradient(90deg,#9bc4c7 0 var(--r7-range-fill,0%),rgba(155,196,199,.28) var(--r7-range-fill,0%) 100%) !important;
          }
          .r7-player-range::-moz-range-track {
            height: 2px !important;
            background: rgba(155,196,199,.28) !important;
          }
          .r7-player-range::-moz-range-progress { height:2px !important; background:#9bc4c7 !important; }
          .r7-player-range::-webkit-slider-thumb {
            width: 9px !important;
            height: 9px !important;
            margin-top: -3.5px !important;
            background:#d4e4e5 !important;
          }
          .r7-player-range::-moz-range-thumb { width:9px !important;height:9px !important;background:#d4e4e5 !important; }
          .r7-player-volume { width: 88px !important; }
          .r7-player-glyph { width:16px !important;height:16px !important; }

          .video-shell:fullscreen,
          .video-shell:-webkit-full-screen {
            width:100vw !important;
            height:100vh !important;
            max-width:none !important;
            margin:0 !important;
            padding:0 !important;
            border:0 !important;
            display:grid !important;
            place-items:center !important;
            overflow:hidden !important;
            background:#000 !important;
          }
          .video-shell:fullscreen video,
          .video-shell:-webkit-full-screen video {
            width:100vw !important;
            height:100vh !important;
            max-width:none !important;
            max-height:none !important;
            object-fit:contain !important;
            object-position:center !important;
          }
          .video-shell:fullscreen .r7-player-controls,
          .video-shell:-webkit-full-screen .r7-player-controls {
            position:absolute !important;
            left:0 !important;right:0 !important;bottom:0 !important;
            width:100% !important;
            display:block !important;
          }

          @media (max-width: 820px) {
            .video-shell.r7-followup-player .r7-player-controls { display:block !important; padding:34px 8px 7px !important; }
            .video-shell.r7-followup-player .r7-player-row { gap:5px !important; }
            .video-shell.r7-followup-player .r7-player-left,
            .video-shell.r7-followup-player .r7-player-right { gap:2px !important; }
            .video-shell.r7-followup-player .r7-player-button { width:38px !important;height:38px !important;min-width:38px !important; }
            .video-shell.r7-followup-player .r7-player-pip { display:none !important; }
            .video-shell.r7-followup-player .r7-player-volume { display:none !important; }
            .video-shell.r7-followup-player .r7-player-time { min-width:70px !important;font-size:8px !important;letter-spacing:0 !important; }
          }

          /* Mobile Hero rhythm only; desktop Hero remains untouched. */
          @media (max-width: 820px) {
            .hero-inner { padding-bottom:34px !important; }
            .hero-inner > .r7-mobile-hero-copy { margin-top:22px !important; }
            .r7-mobile-hero-actions { margin-top:14px !important; margin-bottom:0 !important; }
          }
          body.r7-phone-landscape .hero-inner { padding-bottom:24px !important; }
          body.r7-phone-landscape .r7-mobile-hero-copy { margin-top:14px !important; }
          body.r7-phone-landscape .r7-mobile-hero-actions { margin-top:10px !important; margin-bottom:0 !important; }

          /* Contact: same single point, ~11% slower than live, genuinely linear travel. */
          .contact-signal-track i { animation: r7FollowupContactTravel 4.1s linear infinite !important; }
          @keyframes r7FollowupContactTravel {
            0% { left:0; opacity:.1; }
            10% { opacity:1; }
            90% { opacity:1; }
            100% { left:calc(100% - 5px); opacity:.1; }
          }

          /* Rating contract remains 0–10. Equal controls; second row optically centered. */
          @media (max-width: 820px) {
            .review-composer .rating-scale {
              grid-template-columns:repeat(12,minmax(0,1fr)) !important;
              gap:6px !important;
            }
            .review-composer .rating-button {
              grid-column:span 2 !important;
              width:100% !important;
              min-width:0 !important;
              height:42px !important;
              min-height:42px !important;
            }
            .review-composer .rating-button:nth-child(7) { grid-column:2 / span 2 !important; }
            .review-composer .rating-button:last-child { grid-column:span 2 !important; }
          }

          @media (prefers-reduced-motion: reduce) {
            .contact-signal-track i { animation:none !important; left:50% !important; }
            .subject-dossier *, .faq-response-panel * { transition-duration:0s !important; transition-delay:0s !important; }
            body.r7-sequential-ui #cast .cast-list,
            body.r7-sequential-ui #cast .subject-dossier,
            body.r7-sequential-ui #faq .faq-query-list,
            body.r7-sequential-ui #faq .faq-response-panel { animation:none !important; }
          }
          CSS

          cat > js/r7-live-followup.js <<'JS'
          (() => {
            'use strict';
            const $=(s,r=document)=>r.querySelector(s);

            // Shared semantic nav source: approved order is Actors -> FAQ -> Reviews -> Report.
            function reorderNavigation(){
              const nav=$('#primaryNav'); if(!nav)return;
              const links=[...nav.querySelectorAll('a')];
              const actors=links.find(a=>(a.getAttribute('href')||'').includes('#cast'));
              const faq=links.find(a=>(a.getAttribute('href')||'').includes('#faq'));
              const reviews=links.find(a=>(a.getAttribute('href')||'').includes('reviews'));
              const report=nav.querySelector('.r7-nav-report');
              if(actors&&faq) actors.insertAdjacentElement('afterend',faq);
              if(faq&&reviews) faq.insertAdjacentElement('afterend',reviews);
              if(reviews&&report) reviews.insertAdjacentElement('afterend',report);
            }
            reorderNavigation();

            const video=$('#trailerVideo');
            const shell=$('#videoShell');
            const controls=shell?.querySelector('.r7-player-controls');
            if(!video||!shell||!controls)return;
            shell.classList.add('r7-followup-player');

            const progress=controls.querySelector('.r7-player-progress');
            const volume=controls.querySelector('.r7-player-volume');
            const pip=controls.querySelector('.r7-player-pip');
            const fullscreen=controls.querySelector('.r7-player-fullscreen');
            const compact=()=>matchMedia('(max-width: 820px)').matches || (matchMedia('(pointer: coarse)').matches&&innerWidth>innerHeight&&innerWidth<=960&&innerHeight<=560);
            const fsSupported=()=>Boolean(shell.requestFullscreen||shell.webkitRequestFullscreen||video.webkitEnterFullscreen);
            const pipSupported=()=>Boolean((document.pictureInPictureEnabled&&video.requestPictureInPicture)||(video.webkitSupportsPresentationMode?.('picture-in-picture')&&video.webkitSetPresentationMode));

            function syncMode(){
              controls.hidden=false;
              video.controls=false;
              video.setAttribute('controlsList','nodownload noplaybackrate noremoteplayback');
              video.disableRemotePlayback=true;
              if(pip){ pip.hidden=compact()||!pipSupported(); }
              if(fullscreen){ fullscreen.hidden=!fsSupported(); }
              try{ video.disablePictureInPicture=compact(); }catch(_){ }
            }
            function syncRanges(){
              if(progress){
                const pct=Number(progress.value)||0;
                progress.style.setProperty('--r7-range-fill',`${Math.max(0,Math.min(100,pct))}%`);
              }
              if(volume){
                const pct=(Number(volume.value)||0)*100;
                volume.style.setProperty('--r7-range-fill',`${Math.max(0,Math.min(100,pct))}%`);
              }
            }
            ['loadedmetadata','durationchange','timeupdate','seeked','volumechange'].forEach(n=>video.addEventListener(n,()=>requestAnimationFrame(syncRanges)));
            progress?.addEventListener('input',syncRanges);
            volume?.addEventListener('input',syncRanges);

            async function toggleFullscreen(){
              try{
                if(document.fullscreenElement||document.webkitFullscreenElement){
                  const exit=document.exitFullscreen||document.webkitExitFullscreen;
                  if(exit)await exit.call(document);
                  return;
                }
                if(shell.requestFullscreen)await shell.requestFullscreen();
                else if(shell.webkitRequestFullscreen)await shell.webkitRequestFullscreen();
                else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();
              }catch(_){ }
            }

            shell.addEventListener('dblclick',event=>{
              if(compact()||event.target.closest('.r7-player-controls'))return;
              event.preventDefault();
              toggleFullscreen();
            });

            let engaged=false;
            shell.addEventListener('pointerdown',()=>{engaged=true;});
            shell.addEventListener('focusin',()=>{engaged=true;});
            document.addEventListener('pointerdown',event=>{if(!shell.contains(event.target))engaged=false;},true);
            document.addEventListener('focusin',event=>{engaged=shell.contains(event.target);},true);
            document.addEventListener('keydown',event=>{
              if(compact()||event.key.toLowerCase()!=='f'||event.altKey||event.ctrlKey||event.metaKey)return;
              const target=event.target;
              if(target instanceof HTMLElement&&(target.matches('input,textarea,select,button,a[href],[contenteditable="true"]')||target.isContentEditable))return;
              if(!engaged&&!shell.contains(document.activeElement))return;
              event.preventDefault();
              toggleFullscreen();
            });

            addEventListener('resize',()=>{syncMode();syncRanges();},{passive:true});
            addEventListener('orientationchange',()=>requestAnimationFrame(()=>{syncMode();syncRanges();}),{passive:true});
            document.addEventListener('fullscreenchange',syncMode);
            document.addEventListener('webkitfullscreenchange',syncMode);
            syncMode();
            syncRanges();
          })();
