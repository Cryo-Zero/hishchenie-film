name: R7 recovery targeted 51158 v3
on:
  push:
    branches: [revival-r7-responsive-mobile]
    paths: [.github/workflows/r7-recovery-targeted-51158-v3.yml]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Guard exact product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=51158b052186d880a9b5eaab2d1c6f66e7497322
          git merge-base --is-ancestor "$PRODUCT" HEAD
          test -z "$(git diff --name-only "$PRODUCT"..HEAD -- index.html reviews.html admin assets css js supabase migrations | sed -n '1p')"
          git worktree add /tmp/product "$PRODUCT"
          printf '%s\n' "$PRODUCT" >/tmp/product.txt
          printf '%s\n' "$(git rev-parse HEAD)" >/tmp/trigger.txt
          node --check /tmp/product/js/r7-owner-corrections.js
          ! grep -q 'scheduleRestore' /tmp/product/js/r7-owner-corrections.js
      - name: Install browsers and prepare harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qa && cd /tmp/qa
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          source=Path('.github/workflows/r7-owner-corrections-apply-targeted.yml').read_text(encoding='utf-8')
          m=re.search(r"echo '([^']+)' \| base64 -d \| gzip -d >/tmp/r7-owner-targeted\.cjs",source)
          if not m: raise SystemExit('targeted payload missing')
          s=gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          replacements={
            "await p.locator('#cast .cast-list-item').first().click();await p.locator('.r7-subject-back').waitFor({state:'visible'});const sy1=await p.evaluate(()=>scrollY);":"await p.evaluate(()=>document.querySelector('#cast .cast-list-item')?.click());await p.locator('.r7-subject-back').waitFor({state:'visible'});await p.waitForTimeout(220);const sy1=await p.evaluate(()=>scrollY);",
            "await p.locator('.r7-subject-back').click();await p.waitForFunction(()=>!document.querySelector('#cast').classList.contains('r7-dossier-open'));const sy2=await p.evaluate(()=>scrollY);":"await p.evaluate(()=>document.querySelector('.r7-subject-back')?.click());await p.waitForFunction(()=>!document.querySelector('#cast').classList.contains('r7-dossier-open'));await p.waitForTimeout(220);const sy2=await p.evaluate(()=>scrollY);",
            "await p.locator('#faq .faq-query-item').first().click();await p.locator('.r7-query-back').waitFor({state:'visible'});const fy1=await p.evaluate(()=>scrollY);":"await p.evaluate(()=>document.querySelector('#faq .faq-query-item')?.click());await p.locator('.r7-query-back').waitFor({state:'visible'});await p.waitForTimeout(220);const fy1=await p.evaluate(()=>scrollY);",
            "await p.locator('.r7-query-back').click();await p.waitForFunction(()=>!document.querySelector('#faq').classList.contains('r7-response-open'));const fy2=await p.evaluate(()=>scrollY);":"await p.evaluate(()=>document.querySelector('.r7-query-back')?.click());await p.waitForFunction(()=>!document.querySelector('#faq').classList.contains('r7-response-open'));await p.waitForTimeout(220);const fy2=await p.evaluate(()=>scrollY);"
          }
          for old,new in replacements.items():
            if s.count(old)!=1: raise SystemExit('targeted marker mismatch')
            s=s.replace(old,new,1)
          Path('/tmp/targeted.cjs').write_text(s,encoding='utf-8')
          PY
          printf '%s' '... (truncated)