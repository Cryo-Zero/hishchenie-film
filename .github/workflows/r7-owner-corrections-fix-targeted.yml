name: R7 owner corrections follow-up targeted audit

on:
  push:
    branches:
      - revival-r7-responsive-mobile
    paths:
      - .github/workflows/r7-owner-corrections-fix-targeted.yml

permissions:
  contents: write

jobs:
  fix-and-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: revival-r7-responsive-mobile

      - name: Apply bounded targeted follow-up
        id: product
        shell: bash
        run: |
          set -euo pipefail
          BASE=ca579e2d88d561ad309efabd836137232756f5bf
          git merge-base --is-ancestor "$BASE" HEAD
          test -z "$(git diff --name-only "$BASE"..HEAD -- index.html reviews.html admin assets css js supabase migrations | sed -n '1p')"
          cat >> css/r7-owner-corrections.css <<'CSS'

          /* Owner-correction targeted QA follow-up: resolve legacy specificity and grid-gap interactions. */
          @media (min-width: 821px) {
            #lightbox.open #lightboxPrev,
            #lightbox.open #lightboxNext {
              width: clamp(104px, 14vw, 220px) !important;
              height: min(68vh, 560px) !important;
              min-width: 104px !important;
              min-height: 180px !important;
              border: 0 !important;
              background: transparent !important;
              box-shadow: none !important;
            }
          }
          @media (max-width: 820px) {
            .hero-inner > .r7-mobile-hero-copy { margin-top: -19px !important; }
            .hero-inner > .r7-mobile-hero-actions { margin-top: -24px !important; }
          }
          body.r7-phone-landscape .hero-inner > .r7-mobile-hero-copy { margin-top: -9px !important; }
          body.r7-phone-landscape .hero-inner > .r7-mobile-hero-actions { margin-top: -14px !important; }
          body.r7-phone-landscape.r7-sequential-ui #cast.r7-dossier-open .r7-subject-back,
          body.r7-phone-landscape.r7-sequential-ui #faq.r7-response-open .r7-query-back {
            display: inline-flex !important;
            align-items: center;
            justify-content: flex-start;
          }
          body.r7-sequential-ui #cast .cast-console,
          body.r7-sequential-ui #faq .faq-console { overflow-anchor: none !important; }
          CSS
          cat >> js/r7-owner-corrections.js <<'JS'

          /* Owner-correction follow-up: capture sequential viewport before legacy bubble handlers mutate geometry. */
          (() => {
            'use strict';
            const selector = '#cast .cast-list-item, #cast .r7-subject-back, #cast #dossierPrompt.r7-subject-return, #faq .faq-query-item, #faq .r7-query-back';
            const scheduleRestore = (x, y) => {
              const restore = () => {
                if (Math.abs(scrollX - x) > .5 || Math.abs(scrollY - y) > .5) scrollTo({ left: x, top: y, behavior: 'auto' });
              };
              requestAnimationFrame(() => requestAnimationFrame(restore));
              setTimeout(restore, 60);
              setTimeout(restore, 180);
            };
            document.addEventListener('click', event => {
              if (!(event.target instanceof Element)) return;
              if (!event.target.closest(selector)) return;
              const x = scrollX;
              const y = scrollY;
              scheduleRestore(x, y);
            }, true);
          })();
          JS
          node --check js/r7-owner-corrections.js
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "css/r7-owner-corrections.css js/r7-owner-corrections.js "
          git config user.name 'Cryo-Zero'
          git config user.email 'Bogdan.Vedrentsov@gmail.com'
          git add css/r7-owner-corrections.css js/r7-owner-corrections.js
          git commit -m 'fix: refine final R7 owner visual corrections'
          PRODUCT_SHA=$(git rev-parse HEAD)
          echo "product_sha=$PRODUCT_SHA" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$PRODUCT_SHA" >/tmp/R7_OWNER_PRODUCT_SHA.txt
          git push origin HEAD:revival-r7-responsive-mobile
          git worktree add /tmp/r7-owner-product "$PRODUCT_SHA"

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r7qa && cd /tmp/r7qa
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit >/dev/null 2>&1

      - name: Run targeted owner-correction regression
        shell: bash
        env:
          NODE_PATH: /tmp/r7qa/node_modules
          PRODUCT_SHA: ${{ steps.product.outputs.product_sha }}
        run: |
          set -euo pipefail
          OUT=/tmp/r7-owner-targeted-evidence
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp /tmp/R7_OWNER_PRODUCT_SHA.txt "$OUT/PRODUCT_SHA.txt"
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          source=Path('.github/workflows/r7-owner-corrections-apply-targeted.yml').read_text(encoding='utf-8')
          m=re.search(r"echo '([^']+)' \| base64 -d \| gzip -d >/tmp/r7-owner-targeted\.cjs",source)
          if not m: raise SystemExit('targeted harness payload missing')
          Path('/tmp/r7-owner-targeted.cjs').write_bytes(gzip.decompress(base64.b64decode(m.group(1))))
          PY
          cp /tmp/r7-owner-targeted.cjs "$OUT/HARNESS-SOURCE.cjs"
          node --check /tmp/r7-owner-targeted.cjs
          python3 -m http.server 4175 --bind 127.0.0.1 --directory /tmp/r7-owner-product >/tmp/r7-owner-targeted-server.log 2>&1 & SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          sleep 1
          set +e
          timeout 1200s env BASE_URL=http://127.0.0.1:4175 PRODUCT_SHA="$PRODUCT_SHA" EVIDENCE_DIR="$OUT" node /tmp/r7-owner-targeted.cjs
          STATUS=$?
          set -e
          printf '%s\n' "$STATUS" > "$OUT/AUDIT_EXIT_CODE.txt"
          cp /tmp/r7-owner-targeted-server.log "$OUT/server.log"
          exit "$STATUS"

      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-owner-corrections-targeted-evidence-v2
          path: /tmp/r7-owner-targeted-evidence
          if-no-files-found: warn
