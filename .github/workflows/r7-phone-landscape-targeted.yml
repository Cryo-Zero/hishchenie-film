name: R7 phone-landscape targeted QA

on:
  push:
    branches:
      - r7-live-followup-pc-mobile
    paths:
      - .github/r7-phone-landscape-targeted.mjs
      - .github/workflows/r7-phone-landscape-targeted.yml

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_SHA: 1e4ea710be8a72224cd0f3f6ef314b87977f140d
      EVIDENCE_DIR: /tmp/r7-phone-landscape-targeted
      BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve targeted runner and freeze exact product
        shell: bash
        run: |
          set -euo pipefail
          cp .github/r7-phone-landscape-targeted.mjs /tmp/r7-phone-landscape-targeted.mjs
          git checkout "$PRODUCT_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium firefox webkit
      - name: Start frozen product server
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/r7-targeted-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/r7-targeted-http.log
          exit 1
      - name: Run bounded Chromium Firefox WebKit checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          node /tmp/r7-phone-landscape-targeted.mjs
      - name: Show targeted report
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/r7-phone-landscape-targeted/REPORT.md ]; then cat /tmp/r7-phone-landscape-targeted/REPORT.md; fi
      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-phone-landscape-targeted-evidence
          path: /tmp/r7-phone-landscape-targeted
          if-no-files-found: error
