name: R7 FAQ recovery apply

on:
  push:
    branches:
      - revival-r7-responsive-mobile
    paths:
      - .github/workflows/r7-faq-recovery-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: revival-r7-responsive-mobile
      - name: Apply bounded CSS correction
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_BASE=66c31fa36896b3b968799ec154fd3bbdb6f4a2e5
          git merge-base --is-ancestor "$PRODUCT_BASE" HEAD
          test -z "$(git diff --name-only "$PRODUCT_BASE"..HEAD -- index.html reviews.html admin assets css js supabase migrations | sed -n '1p')"
          ! grep -q 'FAQ recovery: structural reveal stays un-translated' css/r7-owner-corrections.css
          printf '%s' '' | base64 -d >> css/r7-owner-corrections.css
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "css/r7-owner-corrections.css "
          git config user.name 'Cryo-Zero'
          git config user.email 'Bogdan.Vedrentsov@gmail.com'
          git add css/r7-owner-corrections.css
          git commit -m 'fix: keep mobile FAQ structure stationary'
          git push origin HEAD:revival-r7-responsive-mobile
