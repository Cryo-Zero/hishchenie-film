name: R7 browser QA once

on:
  push:
    branches:
      - revival-r7-responsive-mobile

permissions:
  contents: write

env:
  CI: true

jobs:
  browser-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revival-r7-responsive-mobile

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run local site and browser audit
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/r7-http.log 2>&1 &
          echo $! > /tmp/r7-http.pid
          sleep 1
          mkdir -p r7-qa/screenshots
          cat > /tmp/r7-qa.js <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs = require('fs');
          const path = require('path');

          const targets = [
            ['390x844', 390, 844],
            ['844x390', 844, 390],
            ['430x932', 430, 932],
            ['932x430', 932, 430],
            ['768x1024', 768, 1024],
            ['1024x768', 1024, 768],
            ['1366x768', 1366, 768],
            ['1080x1920', 1080, 1920]
          ];

          const report = { generated_at: new Date().toISOString(), checks: [], failures: [], screenshots: [] };
          const add = (name, ok, detail='') => {
            report.checks.push({ name, ok, detail });
            if (!ok) report.failures.push({ name, detail });
          };

          async function shot(page, name, options={}) {
            const file = path.join('r7-qa', 'screenshots', name + '.png');
            await page.screenshot({ path: file, fullPage: false, animations: 'disabled', ...options });
            report.screenshots.push(file);
          }

          const browser = await chromium.launch({ headless: true });
          try {
            for (const [label, width, height] of targets) {
              const context = await browser.newContext({ viewport: { width, height }, isMobile: width <= 960 && height <= 1024, hasTouch: width <= 960 });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', err => pageErrors.push(String(err)));

              await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(500);
              const assets = await page.evaluate(() => ({
                css: [...document.styleSheets].some(s => String(s.href || '').includes('responsive-r7.css')),
                js: !!document.querySelector('script[src*="responsive-r7.js"]'),
                overflow: document.documentElement.scrollWidth - innerWidth,
                sequential: document.body.classList.contains('r7-sequential-ui'),
                landscapeClass: document.body.classList.contains('r7-phone-landscape')
              }));
              add(`index ${label} R7 assets`, assets.css && assets.js, JSON.stringify(assets));
              add(`index ${label} horizontal overflow`, assets.overflow <= 2, `overflow=${assets.overflow}`);
              add(`index ${label} page errors`, pageErrors.length === 0, pageErrors.join(' | '));

              if (label === '390x844' || label === '844x390') {
                await shot(page, `index-${label}-hero`);

                const actor = page.locator('#cast .cast-list-item').first();
                await actor.scrollIntoViewIfNeeded();
                await actor.click();
                await page.waitForTimeout(250);
                const actorState = await page.evaluate(() => ({
                  open: document.querySelector('#cast')?.classList.contains('r7-dossier-open'),
                  listDisplay: getComputedStyle(document.querySelector('#cast .cast-list')).display,
                  dossierDisplay: getComputedStyle(document.querySelector('#subjectDossier')).display,
                  back: !!document.querySelector('#cast .r7-subject-back')
                }));
                add(`actors ${label} sequential open`, actorState.open && actorState.listDisplay === 'none' && actorState.dossierDisplay !== 'none' && actorState.back, JSON.stringify(actorState));
                await shot(page, `index-${label}-actors-dossier`);
                await page.locator('#cast .r7-subject-back').click();
                await page.waitForTimeout(180);

                const query = page.locator('#faq .faq-query-item').nth(2);
                await query.scrollIntoViewIfNeeded();
                await query.click();
                await page.waitForTimeout(250);
                const faqState = await page.evaluate(() => ({
                  open: document.querySelector('#faq')?.classList.contains('r7-response-open'),
                  listDisplay: getComputedStyle(document.querySelector('#faq .faq-query-list')).display,
                  panelDisplay: getComputedStyle(document.querySelector('#faqResponsePanel')).display,
                  back: !!document.querySelector('#faq .r7-query-back'),
                  code: document.querySelector('#faqResponseCode')?.textContent
                }));
                add(`faq ${label} sequential open`, faqState.open && faqState.listDisplay === 'none' && faqState.panelDisplay !== 'none' && faqState.back && /QUERY_03/.test(faqState.code || ''), JSON.stringify(faqState));
                await shot(page, `index-${label}-faq-response`);
              }

              if (label === '1024x768' || label === '1366x768' || label === '1080x1920') {
                const desktopState = await page.evaluate(() => ({
                  sequential: document.body.classList.contains('r7-sequential-ui'),
                  castGrid: getComputedStyle(document.querySelector('#cast .cast-console')).display,
                  faqGrid: getComputedStyle(document.querySelector('#faq .faq-console')).display
                }));
                add(`desktop/tablet ${label} not forced sequential`, !desktopState.sequential, JSON.stringify(desktopState));
              }

              await context.close();
            }

            for (const [label, width, height] of targets) {
              const context = await browser.newContext({ viewport: { width, height }, isMobile: width <= 960 && height <= 1024, hasTouch: width <= 960 });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', err => pageErrors.push(String(err)));
              await page.goto('http://127.0.0.1:4173/reviews.html', { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(900);
              const state = await page.evaluate(() => {
                const rating = document.querySelector('.rating-scale');
                const sort = document.querySelector('.review-sort');
                const layout = document.querySelector('.community-layout');
                return {
                  overflow: document.documentElement.scrollWidth - innerWidth,
                  css: [...document.styleSheets].some(s => String(s.href || '').includes('responsive-r7.css')),
                  js: !!document.querySelector('script[src*="responsive-r7.js"]'),
                  ratingColumns: rating ? getComputedStyle(rating).gridTemplateColumns.split(' ').length : 0,
                  sortColumns: sort ? getComputedStyle(sort).gridTemplateColumns.split(' ').length : 0,
                  layoutColumns: layout ? getComputedStyle(layout).gridTemplateColumns.split(' ').length : 0,
                  textareaSize: document.querySelector('#reviewText') ? getComputedStyle(document.querySelector('#reviewText')).fontSize : null
                };
              });
              add(`reviews ${label} R7 assets`, state.css && state.js, JSON.stringify(state));
              add(`reviews ${label} horizontal overflow`, state.overflow <= 2, `overflow=${state.overflow}`);
              add(`reviews ${label} page errors`, pageErrors.length === 0, pageErrors.join(' | '));

              if (width <= 820) {
                add(`reviews ${label} single-column workspace`, state.layoutColumns === 1, JSON.stringify(state));
                add(`reviews ${label} touch rating grid`, state.ratingColumns === 6, JSON.stringify(state));
                add(`reviews ${label} three sort controls`, state.sortColumns === 3, JSON.stringify(state));
                add(`reviews ${label} textarea avoids iOS zoom`, state.textareaSize === '16px', JSON.stringify(state));
              }

              if (label === '390x844' || label === '844x390') {
                await shot(page, `reviews-${label}-top`);
                await page.locator('#reviewWorkspace').scrollIntoViewIfNeeded();
                await page.waitForTimeout(180);
                await shot(page, `reviews-${label}-workspace`);
              }
              await context.close();
            }
          } finally {
            await browser.close();
          }

          fs.writeFileSync('r7-qa/report.json', JSON.stringify(report, null, 2));
          const lines = [
            '# REVIVAL R7 — browser QA',
            '',
            `Generated: ${report.generated_at}`,
            '',
            `Checks: ${report.checks.length}`,
            `Failures: ${report.failures.length}`,
            '',
            '## Failures',
            ...(report.failures.length ? report.failures.map(x => `- ${x.name}: ${x.detail}`) : ['- none']),
            '',
            '## Checks',
            ...report.checks.map(x => `- ${x.ok ? 'PASS' : 'FAIL'} — ${x.name}${x.detail ? ` — ${x.detail}` : ''}`),
            '',
            '## Screenshots',
            ...report.screenshots.map(x => `- ${x}`),
            ''
          ];
          fs.writeFileSync('r7-qa/REPORT.md', lines.join('\n'));
          if (report.failures.length) process.exitCode = 2;
          NODE
          node /tmp/r7-qa.js

      - name: Upload R7 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-browser-qa
          path: r7-qa/
          if-no-files-found: error
          retention-days: 14

      - name: Remove one-time QA workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/r7-browser-qa.yml
          git config user.name "Cryo-Zero"
          git config user.email "Bogdan.Vedrentsov@gmail.com"
          git add .github/workflows/r7-browser-qa.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-time R7 browser QA [skip ci]"
            git push origin HEAD:revival-r7-responsive-mobile
          fi
