name: R7 final blocker targeted audit

on:
  push:
    branches:
      - revival-r7-responsive-mobile
    paths:
      - .github/workflows/r7-final-blocker-fix.yml

permissions:
  contents: read

jobs:
  targeted-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard and mount exact product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=3fe6265505e6c287061aeae2c6f45c1e66af6bdb
          git merge-base --is-ancestor "$PRODUCT" HEAD
          test -z "$(git diff --name-only "$PRODUCT"..HEAD -- index.html reviews.html admin assets css js supabase migrations | sed -n '1p')"
          git worktree add /tmp/r7-product "$PRODUCT"
          printf '%s\n' "$PRODUCT" >/tmp/R7_FINAL_PRODUCT_SHA.txt

      - name: Install targeted browser runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r7-targeted
          cd /tmp/r7-targeted
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit >/dev/null 2>&1

      - name: Run targeted Profile Help and Bug Report regression
        shell: bash
        env:
          NODE_PATH: /tmp/r7-targeted/node_modules
          PRODUCT_SHA: 3fe6265505e6c287061aeae2c6f45c1e66af6bdb
        run: |
          set -euo pipefail
          OUT=/tmp/r7-final-blocker-targeted
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp /tmp/R7_FINAL_PRODUCT_SHA.txt "$OUT/"
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/r7-product >/tmp/r7-targeted-server.log 2>&1 & SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          sleep 1
          cat > /tmp/r7-targeted/targeted.cjs <<'JS'
          const fs=require('fs');
          const {chromium,firefox,webkit}=require('playwright');
          const base='http://127.0.0.1:4174';
          const out='/tmp/r7-final-blocker-targeted';
          const engines={chromium,firefox,webkit};
          const results=[];
          function record(ok,browser,name,detail=''){results.push({ok,browser,name,detail});if(!ok)console.error('FAIL',browser,name,detail);}
          function near(a,b,t=1){return Math.abs(a-b)<=t;}
          (async()=>{
            for(const [browserName,type] of Object.entries(engines)){
              const browser=await type.launch({headless:true});
              const ctx=await browser.newContext({viewport:{width:1366,height:768}});
              await ctx.route('https://xltwwvutqkpmtmlavngi.supabase.co/**',async route=>{
                const u=route.request().url();
                let body='{}';
                if(u.includes('get_public_channel_state_v2'))body=JSON.stringify({reviews_enabled:true,likes_enabled:true,replies_enabled:true});
                else if(u.includes('get_public_stats_v2'))body=JSON.stringify({total_ratings:0,average_rating:null,positive_ratings:0,freshness:null});
                else if(u.includes('get_public_reviews_v3'))body='[]';
                await route.fulfill({status:200,contentType:'application/json',body});
              });
              const page=await ctx.newPage();
              const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
              await page.goto(base+'/reviews.html?targeted=r7-final',{waitUntil:'domcontentloaded'});
              await page.locator('#profileHelpToggle').waitFor({state:'visible'});
              await page.locator('#profileHelpToggle').scrollIntoViewIfNeeded();
              await page.waitForTimeout(80);
              const baseline=await page.evaluate(()=>{
                const rr=e=>e.getBoundingClientRect(), y=scrollY;
                return {y,profile:rr(document.querySelector('.profile-console')),composer:rr(document.querySelector('.review-composer'))};
              });
              let stable=true,focusOk=true,escapeOk=true,geometryOk=true;
              for(let i=0;i<10;i++){
                await page.evaluate(()=>document.querySelector('#profileHelpToggle').click());
                await page.waitForFunction(()=>!document.querySelector('#profileHelpPanel').hidden && document.activeElement?.id==='profileHelpClose');
                const open=await page.evaluate(()=>{const rr=e=>e.getBoundingClientRect(),y=scrollY;return {y,active:document.activeElement?.id,profile:rr(document.querySelector('.profile-console')),composer:rr(document.querySelector('.review-composer'))};});
                stable=stable&&near(open.y,baseline.y);
                focusOk=focusOk&&open.active==='profileHelpClose';
                geometryOk=geometryOk&&near(open.profile.x,baseline.profile.x)&&near(open.profile.y+open.y,baseline.profile.y+baseline.y)&&near(open.profile.width,baseline.profile.width)&&near(open.profile.height,baseline.profile.height)&&near(open.composer.x,baseline.composer.x)&&near(open.composer.y+open.y,baseline.composer.y+baseline.y)&&near(open.composer.width,baseline.composer.width)&&near(open.composer.height,baseline.composer.height);
                await page.keyboard.press('Escape');
                await page.waitForFunction(()=>document.querySelector('#profileHelpPanel').hidden);
                const closedY=await page.evaluate(()=>scrollY);
                stable=stable&&near(closedY,baseline.y);
                escapeOk=escapeOk&&(await page.locator('#profileHelpPanel').evaluate(e=>e.hidden));
              }
              record(stable,browserName,'Profile Help 10 cycles preserve viewport scrollY',JSON.stringify({baselineY:baseline.y,finalY:await page.evaluate(()=>scrollY)}));
              record(geometryOk,browserName,'Profile Help preserves document-space geometry');
              record(focusOk,browserName,'Profile Help moves keyboard focus to close control without scroll');
              record(escapeOk,browserName,'Profile Help Escape closes');

              const bugExists=await page.evaluate(()=>!!document.querySelector('#bugReportToggle')&&!!document.querySelector('#bugReportPanel')&&!!document.querySelector('#bugReportClose'));
              record(bugExists,browserName,'Bug Report shared overlay DOM exists');
              const bugY=await page.evaluate(()=>scrollY);
              await page.evaluate(()=>document.querySelector('#bugReportToggle').click());
              await page.waitForFunction(()=>!document.querySelector('#bugReportPanel').hidden && document.activeElement?.id==='bugReportClose');
              const bugOpen=await page.evaluate(()=>({y:scrollY,active:document.activeElement?.id}));
              record(near(bugOpen.y,bugY),browserName,'Bug Report shared overlay preserves viewport scrollY',JSON.stringify({before:bugY,after:bugOpen.y}));
              record(bugOpen.active==='bugReportClose',browserName,'Bug Report shared overlay preserves close-control focus');
              await page.keyboard.press('Escape');await page.waitForFunction(()=>document.querySelector('#bugReportPanel').hidden);
              record(near(await page.evaluate(()=>scrollY),bugY),browserName,'Bug Report Escape close preserves viewport');
              record(pageErrors.length===0,browserName,'Targeted page errors = 0',pageErrors.join(' | '));
              await ctx.close();await browser.close();
            }
            const failed=results.filter(x=>!x.ok).length;
            const summary={product_sha:process.env.PRODUCT_SHA,browsers:Object.keys(engines),viewport:'1366x768',total:results.length,passed:results.length-failed,failed,results};
            fs.writeFileSync(out+'/TARGETED-RESULTS.json',JSON.stringify(summary,null,2));
            fs.copyFileSync('/tmp/r7-targeted-server.log',out+'/server.log');
            console.log(JSON.stringify(summary,null,2));
            process.exit(failed?1:0);
          })().catch(e=>{console.error(e);process.exit(2)});
          JS
          NODE_PATH=/tmp/r7-targeted/node_modules node /tmp/r7-targeted/targeted.cjs

      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-final-blocker-targeted-evidence
          path: /tmp/r7-final-blocker-targeted
          if-no-files-found: warn
