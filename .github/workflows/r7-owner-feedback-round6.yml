name: R7 post-Round5 owner feedback browser QA

on:
  push:
    branches:
      - revival-r7-responsive-mobile

permissions:
  contents: write

jobs:
  round6:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact Round5 final baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=4197adc13cc91cbad395e6d2819e0fbb23278449
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE"..HEAD | sort >/tmp/actual
          printf '%s\n' \
            '.github/workflows/r7-owner-feedback-round6.yml' \
            'scripts/r7_round6_apply.py' \
            'scripts/r7_round6_finalize.py' \
            'scripts/r7_round6_qa.cjs' | sort >/tmp/expected
          diff -u /tmp/expected /tmp/actual
          git worktree add /tmp/r7-round6-baseline "$BASE"

      - name: Apply scoped runtime patch
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/r7_round6_apply.py /tmp/r7_round6_apply.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/r7_round6_apply.py')
          s=p.read_text(encoding='utf-8')

          # Existing packaging repair: avoid an extra trailing blank line in the
          # generated CSS append while preserving the scoped Round6 patch.
          old="p.write_text(s.rstrip() + add + '\\n', encoding='utf-8')"
          new="p.write_text(s.rstrip() + add.rstrip() + '\\n', encoding='utf-8')"
          if s.count(old)!=1: raise SystemExit(f'apply packaging marker mismatch: {s.count(old)}')
          s=s.replace(old,new,1)

          # Proven product defect from run 35085468019: the Round6 CONTACT keyframes
          # animated `left`, but the static rule set `left: 0 !important`; author
          # !important therefore pinned the point at x=0 while the diamond still
          # reacted. Keep the positioned left anchor and animate margin-left instead,
          # which physically carries the point across the existing track.
          old_contact="""@keyframes r7Round6ContactTravel {
            0%, 7% { left: 0; opacity: 0; box-shadow: 0 0 5px rgba(155,196,199,.20); }
            14% { opacity: .84; }
            76% { left: calc(100% - 18px); opacity: .88; }
            82% { left: calc(100% - 7px); opacity: 1; box-shadow: 0 0 12px rgba(155,196,199,.62); }
            88%, 100% { left: calc(100% - 7px); opacity: 0; box-shadow: 0 0 4px rgba(155,196,199,.12); }
          }"""
          new_contact="""@keyframes r7Round6ContactTravel {
            0%, 7% { margin-left: 0; opacity: 0; box-shadow: 0 0 5px rgba(155,196,199,.20); }
            14% { opacity: .84; }
            76% { margin-left: calc(100% - 18px); opacity: .88; }
            82% { margin-left: calc(100% - 7px); opacity: 1; box-shadow: 0 0 12px rgba(155,196,199,.62); }
            88%, 100% { margin-left: calc(100% - 7px); opacity: 0; box-shadow: 0 0 4px rgba(155,196,199,.12); }
          }"""
          if s.count(old_contact)!=1: raise SystemExit(f'CONTACT travel marker mismatch: {s.count(old_contact)}')
          s=s.replace(old_contact,new_contact,1)
          s=s.replace('will-change: left, opacity, box-shadow !important;','will-change: margin-left, opacity, box-shadow !important;',1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 /tmp/r7_round6_apply.py

      - name: Install Chromium QA runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r7qa
          cd /tmp/r7qa
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Prepare browser QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('scripts/r7_round6_qa.cjs').read_text(encoding='utf-8')

          # Existing proven false-negative: contextual sequential back controls can
          # legitimately be hidden in some tested contexts.
          old="await p.locator(spec.back).click();await p.waitForTimeout(80);"
          new="if(await p.locator(spec.back).isVisible()){await p.locator(spec.back).click();await p.waitForTimeout(80);}"
          if src.count(old)!=1: raise SystemExit(f'QA back-control marker mismatch: {src.count(old)}')
          src=src.replace(old,new,1)

          # CONTACT acceptance is about physical travel, not the implementation
          # detail of CSS `left`. Measure the actual point rectangle at two seek
          # positions so the test remains valid after the proven margin-left repair.
          old_contact="const x0=parseFloat(getComputedStyle(point).left)||0;pa.currentTime=3600;const x1=parseFloat(getComputedStyle(point).left)||0;"
          new_contact="const x0=point.getBoundingClientRect().x;pa.currentTime=3600;const x1=point.getBoundingClientRect().x;"
          if src.count(old_contact)!=1: raise SystemExit(f'QA CONTACT geometry marker mismatch: {src.count(old_contact)}')
          src=src.replace(old_contact,new_contact,1)

          # Proven QA false-negative from run 35085468019: the test itself clicks
          # menuToggle immediately beforehand, which intentionally arms the smart
          # header interaction safeguard for 1200ms. Waiting only 850ms asks the
          # header to hide while the product is correctly keeping it visible.
          old_wait="await p.evaluate(()=>{document.activeElement?.blur();scrollTo(0,0)});await p.waitForTimeout(850);"
          new_wait="await p.evaluate(()=>{document.activeElement?.blur();scrollTo(0,0)});await p.waitForTimeout(1350);"
          if src.count(old_wait)!=1: raise SystemExit(f'QA smart-header guard marker mismatch: {src.count(old_wait)}')
          src=src.replace(old_wait,new_wait,1)

          wrapped="(async () => {\n"+src+"\n})().catch(err => { console.error(err); process.exit(1); });\n"
          Path('/tmp/r7_round6_qa.cjs').write_text(wrapped,encoding='utf-8')
          PY
          node --check /tmp/r7_round6_qa.cjs

      - name: Pre-commit full browser matrix
        shell: bash
        env:
          NODE_PATH: /tmp/r7qa/node_modules
        run: |
          set -euo pipefail
          rm -rf /tmp/r7-round6-pre && mkdir -p /tmp/r7-round6-pre
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/r7-target.log 2>&1 & P1=$!
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/r7-round6-baseline >/tmp/r7-base.log 2>&1 & P2=$!
          trap 'kill $P1 $P2 2>/dev/null || true' EXIT
          sleep 1
          timeout 360s env TARGET_URL=http://127.0.0.1:4173 BASELINE_URL=http://127.0.0.1:4174 EVIDENCE_DIR=/tmp/r7-round6-pre node /tmp/r7_round6_qa.cjs

      - name: Create clean Round6 final commit
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/r7_round6_finalize.py /tmp/r7_round6_finalize.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/r7_round6_finalize.py')
          s=p.read_text(encoding='utf-8')
          old="p.write_text(s.rstrip()+add+'\\n',encoding='utf-8')"
          new="p.write_text(s.rstrip()+'\\n\\n'+add.strip()+'\\n',encoding='utf-8')"
          if s.count(old)!=1: raise SystemExit(f'finalizer docs append marker mismatch: {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 /tmp/r7_round6_finalize.py

      - name: Exact-final-SHA full browser verification
        shell: bash
        env:
          NODE_PATH: /tmp/r7qa/node_modules
        run: |
          set -euo pipefail
          FINAL=$(cat /tmp/r7-round6-final-sha.txt)
          test "$(git rev-parse HEAD)" = "$FINAL"
          test -z "$(git status --porcelain)"
          test ! -e .github/workflows/r7-owner-feedback-round6.yml
          git diff --name-only 4197adc13cc91cbad395e6d2819e0fbb23278449..HEAD | sort >/tmp/final-actual
          printf '%s\n' \
            'css/responsive-r7-polish.css' \
            'docs/current/VISUAL-SYSTEM.md' \
            'docs/releases/revival/R7/OWNER-FEEDBACK-ROUND6.md' \
            'docs/releases/revival/R7/PREVIEW-HANDOFF.md' \
            'js/responsive-r7.js' \
            'js/site.js' | sort >/tmp/final-expected
          diff -u /tmp/final-expected /tmp/final-actual
          rm -rf /tmp/r7-round6-final && mkdir -p /tmp/r7-round6-final
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/r7-target-final.log 2>&1 & P1=$!
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/r7-round6-baseline >/tmp/r7-base-final.log 2>&1 & P2=$!
          trap 'kill $P1 $P2 2>/dev/null || true' EXIT
          sleep 1
          timeout 360s env TARGET_URL=http://127.0.0.1:4173 BASELINE_URL=http://127.0.0.1:4174 EVIDENCE_DIR=/tmp/r7-round6-final node /tmp/r7_round6_qa.cjs
          printf '%s\n' "$FINAL" >/tmp/r7-round6-final/FINAL_SHA.txt
          test -z "$(git status --porcelain)"

      - name: Push exact verified final SHA
        shell: bash
        run: |
          set -euo pipefail
          FINAL=$(cat /tmp/r7-round6-final-sha.txt)
          test "$(git rev-parse HEAD)" = "$FINAL"
          test -z "$(git status --porcelain)"
          git push origin HEAD:revival-r7-responsive-mobile
          REMOTE=$(git ls-remote origin refs/heads/revival-r7-responsive-mobile | cut -f1)
          test "$REMOTE" = "$FINAL"
          echo "$REMOTE"

      - name: Upload exact-final browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: r7-round6-exact-final-browser-evidence
          path: /tmp/r7-round6-final
