name: R7 prepare final blocker-fix audit

on:
  push:
    branches:
      - revival-r7-responsive-mobile
    paths:
      - .github/workflows/r7-prepare-final-audit.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: revival-r7-responsive-mobile
      - name: Point authoritative audit at exact fixed product SHA
        shell: bash
        run: |
          set -euo pipefail
          OLD=fb2a7e5060f24b0f2c6f1bd4baf35288631816e7
          NEW=3fe6265505e6c287061aeae2c6f45c1e66af6bdb
          FILE=.github/workflows/r7-post-final-stability-audit-final.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/r7-post-final-stability-audit-final.yml')
          s=p.read_text(encoding='utf-8')
          old='fb2a7e5060f24b0f2c6f1bd4baf35288631816e7'
          new='3fe6265505e6c287061aeae2c6f45c1e66af6bdb'
          product_old=f'PRODUCT={old}'
          product_new=f'PRODUCT={new}'
          env_old=f'PRODUCT_SHA={old}'
          env_new=f'PRODUCT_SHA={new}'
          if s.count(product_old)!=1:
              raise SystemExit(f'PRODUCT marker count {s.count(product_old)}')
          if s.count(env_old)!=1:
              raise SystemExit(f'PRODUCT_SHA marker count {s.count(env_old)}')
          s=s.replace(product_old,product_new,1).replace(env_old,env_new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "$FILE"
          grep -F "PRODUCT=$NEW" "$FILE"
          grep -F "FRESH=$OLD" "$FILE"
          grep -F "PRODUCT_SHA=$NEW" "$FILE"
          git config user.name 'Cryo-Zero'
          git config user.email 'Bogdan.Vedrentsov@gmail.com'
          git add "$FILE"
          git commit -m 'test: audit exact final blocker-fix product'
          git push origin HEAD:revival-r7-responsive-mobile
